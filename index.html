<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f3"><title>키오스크 주문 연습</title><link rel="stylesheet" href="style-final.css?v=5"></head><body><section id="home" class="home"><div class="homeHead"><h1>어디에서 주문할까요?</h1><p>연습할 가게를 선택하세요.</p></div><div id="storeGrid" class="storeGrid"></div></section><section id="app" class="hidden"><header class="top"><div class="topIn"><button class="back" onclick="goHome()">← 가게 선택</button><div id="brand" class="brand"></div><div class="modes"><button id="freeBtn" class="mode on" onclick="setMode('free')">자유 연습</button><button id="missionBtn" class="mode" onclick="setMode('mission')">미션 연습</button></div></div></header><main class="main"><section class="stepRow"><div class="stepCard"><b>어디에서 드시나요?</b><div class="seg"><button id="dineBtn" class="on" onclick="setOrderType('매장')">매장</button><button id="takeBtn" onclick="setOrderType('포장')">포장</button></div></div><div class="stepCard"><b>현재 연습</b><span id="modeGuide">자유롭게 주문해 보세요.</span></div></section><section id="missionBox" class="mission hidden"><div class="missionLabel">오늘의 주문 미션</div><div id="missionText" class="missionText"></div><div class="missionActions"><button onclick="newMission()">새 미션</button><button onclick="speakMission()">다시 듣기</button></div></section><div class="layout"><aside class="categoryPanel"><div id="catList" class="catList"></div></aside><section class="menuPanel"><div class="menuHead"><h2 id="catTitle"></h2><span>메뉴를 눌러 주문하세요.</span></div><div id="menuGrid" class="menuGrid"></div></section><aside class="cartPanel"><h2>장바구니</h2><div id="cartBox"></div><div class="total"><span>총 금액</span><strong id="total">0원</strong></div><button id="payBtn" class="payBtn" disabled onclick="openPayment()">결제하기</button></aside></div></main></section><div id="modal"></div><script src="webp1.js?v=5"></script><script src="webp3.js?v=5"></script><script src="webp4.js?v=5"></script><script src="webp5.js?v=5"></script><script src="webp6.js?v=5"></script><script src="app-final.js?v=5"></script></body></html>
