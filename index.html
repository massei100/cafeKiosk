<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>카페 키오스크 연습</title>
<meta name="theme-color" content="#5d4037">
<style>
:root{--bg:#f7f2ec;--panel:#fffdf9;--brown:#5d4037;--cream:#efe3d5;--green:#66a06f;--red:#d9534f;--text:#2f2926;--muted:#776c66;--shadow:0 8px 24px rgba(78,58,48,.12);--radius:22px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eadfd4;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.18rem}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#8d6e63,#5d4037);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:var(--shadow)}.mode-switch{display:flex;gap:8px}.mode-switch button,.smallbtn{border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:#eee5dd;color:var(--brown);cursor:pointer}.mode-switch button.active{background:var(--brown);color:#fff}.app{max-width:1180px;margin:0 auto;padding:18px}.mission-box{display:none;background:#fff7e9;border:3px solid #f7c86c;border-radius:20px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}.mission-box.show{display:block}.mission-title{font-weight:900;color:#8a5a13;margin-bottom:8px;font-size:1.1rem}.mission-text{font-size:1.16rem;font-weight:850;line-height:1.6}.mission-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:160px 1fr 320px;gap:16px;align-items:start}.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.categories{padding:12px}.cat-btn{width:100%;border:0;background:#f4ece5;border-radius:17px;padding:16px 8px;margin-bottom:10px;font-weight:900;color:var(--brown);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}.cat-btn .ico{font-size:30px}.cat-btn.active{background:var(--brown);color:#fff}.content{padding:16px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:4px 2px 14px}.section-title h2{margin:0;font-size:1.35rem}.section-title span{color:var(--muted);font-size:.92rem}.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.menu-card{border:0;background:#fff;border-radius:19px;box-shadow:0 5px 17px rgba(60,45,37,.1);padding:0;overflow:hidden;cursor:pointer;text-align:left}.menu-visual{aspect-ratio:1.18/1;display:grid;place-items:center;background:linear-gradient(155deg,#fff8ef,#ead7c2);position:relative}.menu-visual .cup{font-size:64px;filter:drop-shadow(0 8px 7px rgba(0,0,0,.12))}.menu-visual .tag{position:absolute;right:10px;top:10px;background:#fff;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:900;color:var(--brown)}.menu-info{padding:12px 13px 14px}.menu-name{font-weight:900;font-size:1.02rem;margin-bottom:5px}.menu-desc{font-size:.78rem;color:var(--muted);min-height:2.2em}.price{margin-top:8px;font-weight:900;color:var(--brown)}.cart{padding:14px;position:sticky;top:78px}.cart h3{margin:3px 0 12px}.cart-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}.empty{padding:28px 10px;text-align:center;color:#998a82}.cart-item{background:#f7f1eb;border-radius:14px;padding:10px}.cart-line{display:flex;justify-content:space-between;gap:8px;font-weight:850}.cart-opt{font-size:.77rem;color:var(--muted);margin-top:3px}.cart-controls{display:flex;justify-content:flex-end;gap:5px;margin-top:7px}.circle{border:0;width:30px;height:30px;border-radius:50%;background:#fff;font-weight:900;cursor:pointer}.total{display:flex;justify-content:space-between;border-top:2px dashed #e5d7cc;margin-top:14px;padding-top:14px;font-size:1.2rem;font-weight:950}.checkout{width:100%;border:0;background:var(--brown);color:#fff;border-radius:16px;padding:15px;margin-top:12px;font-size:1.05rem;font-weight:900;cursor:pointer}.checkout:disabled{opacity:.4}.overlay{position:fixed;inset:0;background:rgba(35,28,24,.56);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.overlay.show{display:flex}.modal{background:#fff;border-radius:26px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 65px rgba(0,0,0,.24)}.modal-head{padding:18px 20px;border-bottom:1px solid #eee3db;display:flex;justify-content:space-between;gap:15px;align-items:center}.modal-head h3{margin:0}.close{border:0;background:#f0e9e4;border-radius:50%;width:36px;height:36px;font-size:20px}.modal-body{padding:18px 20px}.opt-group{margin-bottom:18px}.label{font-weight:900;margin-bottom:9px}.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opt-btn{border:2px solid #e4d7ce;background:#fff;border-radius:14px;padding:13px 8px;font-weight:850}.opt-btn.selected{border-color:var(--brown);background:#f4ebe5;color:var(--brown)}.add-btn{width:100%;border:0;background:var(--green);color:#fff;border-radius:16px;padding:14px;font-weight:900}.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-card{border:2px solid #e5d9d1;background:#fff;border-radius:18px;padding:20px 10px;font-size:1.05rem;font-weight:900}.money-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.money{border:0;border-radius:12px;background:#efe7df;padding:12px 7px;font-weight:900}.money-summary{background:#faf5ef;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7}.final-actions{display:flex;gap:9px;margin-top:15px}.secondary,.primary{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900}.secondary{background:#eee4dc;color:var(--brown)}.primary{background:var(--brown);color:#fff}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(25px);background:#2f2926;color:#fff;padding:13px 18px;border-radius:999px;font-weight:850;opacity:0;transition:.25s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.receipt{width:min(360px,100%);margin:0 auto;background:#fffdf8;border:1px solid #d9d0ca;padding:20px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 12px 30px rgba(0,0,0,.12)}.receipt h2{text-align:center;margin:0 0 3px;font-family:system-ui}.center{text-align:center}.receipt hr{border:0;border-top:1px dashed #999;margin:13px 0}.rline{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.order-no{text-align:center;font-size:2rem;font-weight:1000;color:var(--brown);margin:8px 0}.success{font-weight:950;color:var(--green);text-align:center;margin:10px 0}.fail{font-weight:950;color:var(--red);text-align:center;margin:10px 0}@media(max-width:920px){.layout{grid-template-columns:110px 1fr}.cart{position:static;grid-column:1/-1}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.topbar{padding:10px}.brand span{display:none}.app{padding:10px}.layout{display:block}.categories{display:flex;overflow:auto;gap:8px;margin-bottom:10px}.cat-btn{min-width:88px;margin:0;padding:10px 8px}.cat-btn .ico{font-size:24px}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menu-visual .cup{font-size:50px}.menu-info{padding:10px}.menu-desc{display:none}.cart{margin-top:10px}.mode-switch button{padding:9px 10px;font-size:.86rem}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">☕</div><span>카페 키오스크 연습</span></div><div class="mode-switch"><button id="practiceBtn" class="active">자유 연습</button><button id="missionBtn">미션 연습</button></div></header>
<main class="app"><section id="missionBox" class="mission-box"><div class="mission-title">🎯 오늘의 주문 미션</div><div id="missionText" class="mission-text"></div><div class="mission-actions"><button class="smallbtn" id="newMission">새 미션</button><button class="smallbtn" id="hearMission">🔊 다시 듣기</button></div></section><div class="layout"><aside class="panel categories" id="categories"></aside><section class="panel content"><div class="section-title"><h2 id="catTitle">커피</h2><span>메뉴를 눌러 주문하세요.</span></div><div class="menu-grid" id="menuGrid"></div></section><aside class="panel cart"><h3>🛒 장바구니</h3><div class="cart-list" id="cartList"></div><div class="total"><span>총 금액</span><span id="total">0원</span></div><button id="checkout" class="checkout" disabled>결제하기</button></aside></div></main>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const data={"커피":[{id:"americano",name:"아메리카노",price:3000,icon:"☕",desc:"깔끔하고 진한 커피",temp:true,size:true},{id:"latte",name:"카페라떼",price:3800,icon:"🥛",desc:"우유가 들어간 부드러운 커피",temp:true,size:true},{id:"vanilla",name:"바닐라라떼",price:4300,icon:"🍮",desc:"달콤한 바닐라 향의 라떼",temp:true,size:true},{id:"mocha",name:"카페모카",price:4500,icon:"🍫",desc:"초콜릿과 커피의 조합",temp:true,size:true},{id:"caramel",name:"카라멜마키아토",price:4500,icon:"🧋",desc:"달콤한 카라멜 커피",temp:true,size:true},{id:"espresso",name:"에스프레소",price:2800,icon:"☕",desc:"작고 진한 커피",temp:false,size:false}],"스무디":[{id:"strawberry",name:"딸기 스무디",price:5000,icon:"🍓",desc:"상큼달콤 딸기 스무디",temp:false,size:true},{id:"mango",name:"망고 스무디",price:5200,icon:"🥭",desc:"달콤한 망고 스무디",temp:false,size:true},{id:"blueberry",name:"블루베리 스무디",price:5200,icon:"🫐",desc:"새콤달콤 블루베리",temp:false,size:true},{id:"yogurt",name:"요거트 스무디",price:4800,icon:"🥣",desc:"부드러운 요거트 스무디",temp:false,size:true}],"차":[{id:"lemontea",name:"레몬차",price:3800,icon:"🍋",desc:"상큼한 레몬차",temp:true,size:true},{id:"grapefruit",name:"자몽차",price:4000,icon:"🍊",desc:"쌉싸름하고 상큼한 자몽차",temp:true,size:true},{id:"greentea",name:"녹차",price:3500,icon:"🍵",desc:"향긋한 녹차",temp:true,size:true},{id:"peach",name:"복숭아 아이스티",price:3500,icon:"🍑",desc:"달콤하고 시원한 아이스티",temp:false,size:true}],"에이드":[{id:"lemonade",name:"레몬 에이드",price:4500,icon:"🍋",desc:"톡 쏘는 레몬 탄산음료",temp:false,size:true},{id:"grapeade",name:"청포도 에이드",price:4700,icon:"🍇",desc:"상큼한 청포도 에이드",temp:false,size:true},{id:"orangeade",name:"오렌지 에이드",price:4500,icon:"🍊",desc:"상큼한 오렌지 에이드",temp:false,size:true}],"디저트":[{id:"cake",name:"초코 케이크",price:5500,icon:"🍰",desc:"진한 초콜릿 케이크",temp:false,size:false},{id:"croissant",name:"크루아상",price:3800,icon:"🥐",desc:"바삭한 버터 크루아상",temp:false,size:false},{id:"cookie",name:"초코칩 쿠키",price:2500,icon:"🍪",desc:"달콤한 초코칩 쿠키",temp:false,size:false},{id:"macaron",name:"마카롱",price:2200,icon:"🧁",desc:"한입 크기 달콤한 디저트",temp:false,size:false}]};
const catIcons={"커피":"☕","스무디":"🥤","차":"🍵","에이드":"🫧","디저트":"🍰"};let currentCat="커피",cart=[],mode="practice",mission=null,tempChoice="ICE",sizeChoice="보통",paid=0;const $=s=>document.querySelector(s),won=n=>n.toLocaleString("ko-KR")+"원";
function renderCats(){$("#categories").innerHTML=Object.keys(data).map(c=>`<button class="cat-btn ${c===currentCat?'active':''}" onclick="setCat('${c}')"><span class="ico">${catIcons[c]}</span>${c}</button>`).join("")}function setCat(c){currentCat=c;$("#catTitle").textContent=c;renderCats();renderMenu()}function renderMenu(){$("#menuGrid").innerHTML=data[currentCat].map(x=>`<button class="menu-card" onclick="openItem('${x.id}')"><div class="menu-visual"><span class="cup">${x.icon}</span><span class="tag">${currentCat}</span></div><div class="menu-info"><div class="menu-name">${x.name}</div><div class="menu-desc">${x.desc}</div><div class="price">${won(x.price)}~</div></div></button>`).join("")}function findItem(id){for(const[cat,arr]of Object.entries(data)){const x=arr.find(v=>v.id===id);if(x)return{...x,cat}}}
function openItem(id){const x=findItem(id);tempChoice=x.temp?"ICE":"없음";sizeChoice=x.size?"보통":"없음";$("#modal").innerHTML=`<div class="modal-head"><h3>${x.icon} ${x.name}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${x.temp?`<div class="opt-group"><div class="label">1. 온도를 선택하세요</div><div class="opt-grid"><button class="opt-btn" id="hot" onclick="chooseTemp('HOT')">🔥 HOT</button><button class="opt-btn selected" id="ice" onclick="chooseTemp('ICE')">🧊 ICE</button></div></div>`:""}${x.size?`<div class="opt-group"><div class="label">${x.temp?'2':'1'}. 크기를 선택하세요</div><div class="opt-grid"><button class="opt-btn selected" id="normal" onclick="chooseSize('보통')">보통</button><button class="opt-btn" id="large" onclick="chooseSize('큰 사이즈')">큰 사이즈 +500원</button></div></div>`:""}<button class="add-btn" onclick="addToCart('${x.id}')">장바구니에 담기</button></div>`;$("#overlay").classList.add("show")}
function chooseTemp(v){tempChoice=v;["hot","ice"].forEach(id=>$("#"+id)?.classList.remove("selected"));$("#"+(v==="HOT"?"hot":"ice"))?.classList.add("selected")}function chooseSize(v){sizeChoice=v;["normal","large"].forEach(id=>$("#"+id)?.classList.remove("selected"));$("#"+(v==="보통"?"normal":"large"))?.classList.add("selected")}function closeModal(){$("#overlay").classList.remove("show")}
function addToCart(id){const x=findItem(id),finalPrice=x.price+(sizeChoice==="큰 사이즈"?500:0),key=[id,tempChoice,sizeChoice].join("|");const old=cart.find(i=>i.key===key);if(old)old.qty++;else cart.push({...x,key,temp:tempChoice,size:sizeChoice,finalPrice,qty:1});closeModal();renderCart();toast("장바구니에 담았어요.")}
function renderCart(){const box=$("#cartList");box.innerHTML=!cart.length?`<div class="empty">메뉴를 선택해 주세요.</div>`:cart.map((i,idx)=>`<div class="cart-item"><div class="cart-line"><span>${i.icon} ${i.name}</span><span>${won(i.finalPrice*i.qty)}</span></div><div class="cart-opt">${[i.temp!=="없음"?i.temp:"",i.size!=="없음"?i.size:""].filter(Boolean).join(" · ")}</div><div class="cart-controls"><button class="circle" onclick="changeQty(${idx},-1)">−</button><b style="padding:5px 4px">${i.qty}</b><button class="circle" onclick="changeQty(${idx},1)">＋</button></div></div>`).join("");$("#total").textContent=won(total());$("#checkout").disabled=!cart.length}function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}function total(){return cart.reduce((s,i)=>s+i.finalPrice*i.qty,0)}function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
function startCheckout(){$("#modal").innerHTML=`<div class="modal-head"><h3>결제 방법을 선택하세요</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="pay-methods"><button class="pay-card" onclick="openCardPay()">💳<br>카드 결제</button><button class="pay-card" onclick="openCashPay()">💵<br>현금 결제</button></div><div class="money-summary"><b>결제할 금액</b><br><span style="font-size:1.45rem;font-weight:950">${won(total())}</span></div></div>`;$("#overlay").classList.add("show")}
function openCardPay(){$("#modal").innerHTML=`<div class="modal-head"><h3>💳 카드 결제</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div style="font-size:4rem;text-align:center">💳</div><p style="text-align:center;font-size:1.12rem;font-weight:850"></p><button class="primary" style="width:100%;margin-top:8px" onclick="finishPay('card',${total()})">카드 결제 완료</button></div>`}
function openCashPay(){paid=0;$("#modal").innerHTML=`<div class="modal-head"><h3>💵 현금 결제</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="label">돈을 눌러 금액을 맞춰보세요.</div><div class="money-grid">${[100,500,1000,5000,10000,50000].map(v=>`<button class="money" onclick="addMoney(${v})">${won(v)}</button>`).join("")}</div><div class="money-summary"><div>상품 금액: <b>${won(total())}</b></div><div>낸 금액: <b id="paid">${won(0)}</b></div><div>거스름돈: <b id="change">${won(0)}</b></div></div><div class="final-actions"><button class="secondary" onclick="paid=0;updateMoney()">다시 내기</button><button class="primary" onclick="finishCash()">결제하기</button></div></div>`}function addMoney(v){paid+=v;updateMoney()}function updateMoney(){$("#paid").textContent=won(paid);$("#change").textContent=won(Math.max(0,paid-total()))}function finishCash(){if(paid<total()){toast("금액이 부족해요.");return}finishPay("cash",paid)}
function finishPay(method,paidAmount){const order=Math.floor(100+Math.random()*900),missionResult=mode==="mission"?checkMission(method):"",items=cart.map(i=>`<div class="rline"><span>${i.name} x${i.qty}</span><span>${won(i.finalPrice*i.qty)}</span></div>`).join(""),change=method==="cash"?paidAmount-total():0;$("#modal").innerHTML=`<div class="modal-head"><h3>주문 완료</h3><button class="close" onclick="resetAfterPay()">×</button></div><div class="modal-body">${missionResult}<div class="receipt"><h2>CAFE PRACTICE</h2><div class="center">카페 키오스크 연습점</div><hr><div class="center">주문번호</div><div class="order-no">${order}</div><hr>${items}<hr><div class="rline"><b>합계</b><b>${won(total())}</b></div><div class="rline"><span>결제</span><span>${method==="cash"?"현금":"카드"}</span></div>${method==="cash"?`<div class="rline"><span>받은 금액</span><span>${won(paidAmount)}</span></div><div class="rline"><span>거스름돈</span><span>${won(change)}</span></div>`:""}<hr><div class="center">이용해 주셔서 감사합니다.</div></div><button class="primary" style="width:100%;margin-top:14px" onclick="resetAfterPay()">처음으로</button></div>`}
function resetAfterPay(){closeModal();cart=[];renderCart();if(mode==="mission")makeMission()}function flatItems(){return Object.values(data).flat()}function makeMission(){const all=flatItems().filter(x=>x.id!=="espresso"),count=Math.random()<.55?1:2,chosen=[];while(chosen.length<count){const x=all[Math.floor(Math.random()*all.length)];if(!chosen.find(c=>c.id===x.id))chosen.push(x)}const missionItems=chosen.map(x=>({id:x.id,name:x.name,qty:1,temp:x.temp?(Math.random()<.5?"ICE":"HOT"):"없음",size:x.size?(Math.random()<.72?"보통":"큰 사이즈"):"없음"})),method=Math.random()<.5?"card":"cash";mission={items:missionItems,method};let text=missionItems.map(i=>`${i.temp!=="없음"?i.temp+" ":""}${i.name} ${i.qty}개${i.size==="큰 사이즈"?" (큰 사이즈)":""}`).join(" + ")+`를 주문하고 ${method==="cash"?"현금":"카드"}으로 결제하세요.`;$("#missionText").textContent=text;cart=[];renderCart()}
function checkMission(method){const desired=[...mission.items].sort((a,b)=>a.id.localeCompare(b.id)),actual=[];cart.forEach(i=>{for(let q=0;q<i.qty;q++)actual.push({id:i.id,temp:i.temp,size:i.size})});actual.sort((a,b)=>a.id.localeCompare(b.id));const okItems=desired.length===actual.length&&desired.every((d,idx)=>d.id===actual[idx].id&&d.temp===actual[idx].temp&&d.size===actual[idx].size),okMethod=method===mission.method;if(okItems&&okMethod){speak("미션 성공! 아주 잘했어요.");return`<div class="success">🎉 미션 성공! 주문을 정확하게 완료했어요.</div>`}const why=[];if(!okItems)why.push("메뉴 또는 옵션");if(!okMethod)why.push("결제 방법");speak("아쉬워요. 미션을 다시 확인해 보세요.");return`<div class="fail">🔎 다시 확인해 볼까요? ${why.join(", ")}을 확인해 주세요.</div>`}
function setMode(m){mode=m;$("#practiceBtn").classList.toggle("active",m==="practice");$("#missionBtn").classList.toggle("active",m==="mission");$("#missionBox").classList.toggle("show",m==="mission");cart=[];renderCart();if(m==="mission")makeMission()}function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.9;speechSynthesis.speak(u)}}
$("#practiceBtn").onclick=()=>setMode("practice");$("#missionBtn").onclick=()=>setMode("mission");$("#newMission").onclick=makeMission;$("#hearMission").onclick=()=>speak($("#missionText").textContent);$("#checkout").onclick=startCheckout;$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});renderCats();renderMenu();renderCart();
</script></body></html>
