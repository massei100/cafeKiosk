<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>키오스크 주문 연습</title><style>

one}.app{padding:9px}.layout{display:block}.cats{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.cat{min-width:86px;margin:0;padding:10px 8px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.menu img{height:135px}.info{padding:9px}.cart{margin-top:9px}.mode button{padding:8px 9px;font-size:.82rem}}
</style></head><body>
<section id="home" class="home"><h1>어디에서 주문할까요?</h1><p>연습할 가게를 선택하세요.</p><div class="storegrid"><button class="store" onclick="enter('cafe')"><img src="https://loremflickr.com/900/650/cafe,coffee?lock=101" alt="카페"><div class="label"><h2>카페</h2><p>커피 · 스무디 · 차 · 에이드 · 디저트</p></div></button><button class="store" onclick="enter('burger')"><img src="https://loremflickr.com/900/650/burger,fries?lock=102" alt="햄버거 가게"><div class="label"><h2>햄버거 가게</h2><p>버거 · 세트 · 사이드 · 치킨 · 음료 · 디저트</p></div></button><button class="store" onclick="enter('bunsik')"><img src="https://loremflickr.com/900/650/tteokbokki,korean-food?lock=103" alt="분식집"><div class="label"><h2>분식집</h2><p>떡볶이 · 김밥 · 튀김 · 면 · 식사 · 음료</p></div></button></div></section>
<section id="kiosk" class="hidden"><header class="top"><div class="brand"><button class="back" onclick="goHome()">가게 선택</button><span id="title"></span></div><div class="mode"><button id="free" class="active">자유 연습</button><button id="missionBtn">미션 연습</button></div></header><main class="app"><section id="mission" class="mission"><b>오늘의 주문 미션</b><div id="missionText" class="missionText"></div><div style="display:flex;gap:8px;margin-top:9px"><button class="small" id="newMission">새 미션</button><button class="small" id="hear">다시 듣기</button></div></section><div class="layout"><aside class="panel cats" id="cats"></aside><section class="panel content"><div class="contentHead"><h2 id="catTitle"></h2><span>메뉴를 눌러 주문하세요.</span></div><div class="grid" id="grid"></div></section><aside class="panel cart"><h3>장바구니</h3><div id="cart"></div><div class="tot"><span>총 금액</span><span id="total">0원</span></div><button class="pay" id="checkout" disabled>결제하기</button></aside></div></main></section><div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script>
const P=(q,n)=>`https://loremflickr.com/720/540/${encodeURIComponent(q)}?lock=${n}`;
const data={cafe:{name:'카페',cats:{'커피':[['ame','아메리카노',3500,'iced coffee',201,1,1],['latte','카페라떼',4200,'cafe latte',202,1,1],['van','바닐라라떼',4800,'vanilla latte',203,1,1],['cara','카라멜마키아토',5000,'caramel macchiato coffee',204,1,1],['mocha','카페모카',4800,'mocha coffee',205,1,1],['ein','아인슈페너',5200,'cream coffee',206,0,1]],'스무디':[['straw','딸기 스무디',5500,'strawberry smoothie',211,0,1],['mango','망고 스무디',5500,'mango smoothie',212,0,1],['blue','블루베리 요거트',5800,'blueberry smoothie',213,0,1],['yog','플레인 요거트',5200,'yogurt smoothie',214,0,1]],'차':[['green','녹차라떼',4500,'matcha latte',221,1,1],['choco','초코라떼',4500,'chocolate drink',222,1,1],['lemontea','레몬차',4200,'lemon tea',223,1,1],['grapetea','자몽차',4500,'grapefruit tea',224,1,1]],'에이드':[['lemonade','레몬 에이드',4800,'lemonade',231,0,1],['grapeade','청포도 에이드',5000,'green grape soda',232,0,1],['grapefruitade','자몽 에이드',5000,'grapefruit soda',233,0,1]],'디저트':[['cake','딸기 케이크',5500,'strawberry cake',241,0,0],['chocake','초코 케이크',5800,'chocolate cake',242,0,0],['croissant','크루아상',3500,'croissant',243,0,0],['cookie','초코칩 쿠키',2500,'chocolate chip cookie',244,0,0]]}},burger:{name:'햄버거 가게',cats:{'버거':[['bul','불고기버거',4800,'beef burger',301,0,0],['cheese','치즈버거',5000,'cheeseburger',302,0,0],['double','더블치즈버거',6500,'double cheeseburger',303,0,0],['bacon','베이컨버거',6200,'bacon burger',304,0,0],['chicken','치킨버거',5500,'chicken burger',305,0,0],['shrimp','새우버거',5600,'shrimp burger',306,0,0]],'세트':[['bulset','불고기버거 세트',7800,'burger fries cola',311,0,0],['cheeseset','치즈버거 세트',8000,'cheeseburger fries soda',312,0,0],['chickenset','치킨버거 세트',8500,'chicken burger fries cola',313,0,0],['shrset','새우버거 세트',8600,'shrimp burger fries',314,0,0]],'사이드':[['fries','감자튀김',2500,'french fries',321,0,1],['onion','어니언링',3000,'onion rings',322,0,0],['cheesestick','치즈스틱',2800,'mozzarella sticks',323,0,0],['nugget','치킨너겟',3200,'chicken nuggets',324,0,0]],'치킨':[['wing','치킨윙',4500,'chicken wings',331,0,0],['tender','치킨텐더',4800,'chicken tenders',332,0,0]],'음료':[['cola','콜라',2200,'cola glass',341,0,1],['cider','사이다',2200,'lemon soda glass',342,0,1],['orange','오렌지주스',2800,'orange juice',343,0,1]],'디저트':[['ice','소프트아이스크림',1800,'soft serve ice cream',351,0,0],['sundae','초코 선데이',2500,'chocolate sundae',352,0,0]]}},bunsik:{name:'분식집',cats:{'떡볶이':[['tteok','떡볶이',4000,'tteokbokki',401,0,0],['cheesetteok','치즈떡볶이',4800,'cheese tteokbokki',402,0,0],['rose','로제떡볶이',5200,'rose tteokbokki',403,0,0],['jja','짜장떡볶이',4500,'black sauce tteokbokki',404,0,0],['spicy','매운떡볶이',4500,'spicy tteokbokki',405,0,0]],'김밥':[['gimbap','김밥',3500,'gimbap korean',411,0,0],['tuna','참치김밥',4200,'tuna gimbap',412,0,0],['cheeseg','치즈김밥',4200,'cheese gimbap',413,0,0],['bulgogig','불고기김밥',4500,'beef gimbap',414,0,0]],'튀김':[['mixfry','모둠튀김',4500,'korean fried snacks tempura',421,0,0],['dumpling','튀김만두',3000,'fried dumplings',422,0,0],['sweetpotato','고구마튀김',3000,'sweet potato tempura',423,0,0],['squid','오징어튀김',4000,'squid tempura',424,0,0]],'면':[['ramen','라면',4000,'korean ramen',431,0,0],['udon','우동',4500,'udon noodles',432,0,0],['jjolmyeon','쫄면',5000,'spicy korean noodles',433,0,0]],'식사':[['sundae','순대',4500,'korean sundae sausage',441,0,0],['fishcake','어묵',3500,'korean fish cake',442,0,0],['mandu','찐만두',4000,'korean dumplings',443,0,0]],'음료':[['cola2','콜라',2000,'cola glass',451,0,1],['cider2','사이다',2000,'lemon soda',452,0,1],['water','생수',1000,'bottled water',453,0,0]]}}};
let store=null,cat='',cart=[],mode='free',mission=null,temp='ICE',size='보통',paid=0;const $=s=>document.querySelector(s),won=n=>n.toLocaleString('ko-KR')+'원';
function items(){let a=[];for(const[c,arr]of Object.entries(data[store].cats))for(const x of arr)a.push({id:x[0],name:x[1],price:x[2],query:x[3],lock:x[4],temp:!!x[5],size:!!x[6],cat:c});return a}function item(id){return items().find(x=>x.id===id)}
function enter(s){store=s;document.body.className='theme-'+s;$('#home').classList.add('hidden');$('#kiosk').classList.remove('hidden');$('#title').textContent=data[s].name+' 키오스크';cat=Object.keys(data[s].cats)[0];cart=[];mode='free';$('#free').classList.add('active');$('#missionBtn').classList.remove('active');$('#mission').classList.remove('show');render()}function goHome(){closeM();$('#kiosk').classList.add('hidden');$('#home').classList.remove('hidden');document.body.className=''}function render(){renderCats();renderGrid();renderCart()}function renderCats(){$('#cats').innerHTML=Object.keys(data[store].cats).map(c=>`<button class="cat ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}function setCat(c){cat=c;renderCats();renderGrid()}function renderGrid(){$('#catTitle').textContent=cat;$('#grid').innerHTML=data[store].cats[cat].map(x=>`<button class="menu" onclick="openItem('${x[0]}')"><img loading="lazy" src="${P(x[3],x[4])}" alt="${x[1]}"><div class="info"><div class="name">${x[1]}</div><div class="price">${won(x[2])}${x[6]?'~':''}</div></div></button>`).join('')}
function openItem(id){const x=item(id);temp=x.temp?'ICE':'없음';size=x.size?'보통':'없음';$('#modal').innerHTML=`<div class="mh"><h3>${x.name}</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><img class="detailimg" src="${P(x.query,x.lock)}" alt="${x.name}">${x.temp?`<div class="group"><b>온도를 선택하세요</b><div class="opts"><button id="hot" class="opt" onclick="pickTemp('HOT')">HOT</button><button id="ice" class="opt sel" onclick="pickTemp('ICE')">ICE</button></div></div>`:''}${x.size?`<div class="group"><b>크기를 선택하세요</b><div class="opts"><button id="normal" class="opt sel" onclick="pickSize('보통')">보통</button><button id="large" class="opt" onclick="pickSize('큰 사이즈')">큰 사이즈 +500원</button></div></div>`:''}<button class="add" onclick="addCart('${id}')">장바구니에 담기</button></div>`;$('#ov').classList.add('show')}function pickTemp(v){temp=v;['hot','ice'].forEach(i=>$('#'+i)?.classList.remove('sel'));$('#'+(v==='HOT'?'hot':'ice'))?.classList.add('sel')}function pickSize(v){size=v;['normal','large'].forEach(i=>$('#'+i)?.classList.remove('sel'));$('#'+(v==='보통'?'normal':'large'))?.classList.add('sel')}function closeM(){$('#ov').classList.remove('show')}
function addCart(id){const x=item(id),fp=x.price+(size==='큰 사이즈'?500:0),key=[id,temp,size].join('|'),old=cart.find(i=>i.key===key);if(old)old.qty++;else cart.push({...x,key,temp,size,fp,qty:1});closeM();renderCart()}function renderCart(){const b=$('#cart');b.innerHTML=!cart.length?'<div class="empty">메뉴를 선택해 주세요.</div>':cart.map((i,n)=>`<div class="ci"><div class="cl"><span>${i.name}</span><span>${won(i.fp*i.qty)}</span></div><div class="co">${[i.temp!=='없음'?i.temp:'',i.size!=='없음'?i.size:''].filter(Boolean).join(' · ')}</div><div class="qc"><button class="q" onclick="qty(${n},-1)">−</button><b>${i.qty}</b><button class="q" onclick="qty(${n},1)">+</button></div></div>`).join('');$('#total').textContent=won(total());$('#checkout').disabled=!cart.length}function qty(n,d){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);renderCart()}function total(){return cart.reduce((s,i)=>s+i.fp*i.qty,0)}
function checkout(){$('#modal').innerHTML=`<div class="mh"><h3>결제 방법을 선택하세요</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><div class="payments"><button class="method" onclick="cardPay()">카드 결제</button><button class="method" onclick="cashPay()">현금 결제</button></div><div class="sum"><b>결제할 금액</b><br><span style="font-size:1.4rem;font-weight:950">${won(total())}</span></div></div>`;$('#ov').classList.add('show')}function cardPay(){$('#modal').innerHTML=`<div class="mh"><h3>카드 결제</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><div style="height:180px;display:grid;place-items:center"><div style="width:180px;height:110px;border-radius:14px;background:linear-gradient(135deg,#1f344f,#54718d);box-shadow:0 14px 28px #0002;transform:rotate(-7deg);position:relative"><div style="width:30px;height:23px;border-radius:5px;background:#e1c565;position:absolute;left:22px;top:42px"></div><div style="position:absolute;left:22px;bottom:18px;color:white;font-weight:800;letter-spacing:2px">CARD</div></div></div><button class="primary" style="width:100%" onclick="finish('card',${total()})">카드 결제 완료</button></div>`}function cashPay(){paid=0;$('#modal').innerHTML=`<div class="mh"><h3>현금 결제</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><b>돈을 눌러 금액을 맞춰보세요.</b><div class="money" style="margin-top:10px">${[100,500,1000,5000,10000,50000].map(v=>`<button onclick="addMoney(${v})">${won(v)}</button>`).join('')}</div><div class="sum"><div>상품 금액: <b>${won(total())}</b></div><div>낸 금액: <b id="paid">0원</b></div><div>거스름돈: <b id="change">0원</b></div></div><div class="actions"><button class="secondary" onclick="paid=0;updateMoney()">다시 내기</button><button class="primary" onclick="finishCash()">결제하기</button></div></div>`}function addMoney(v){paid+=v;updateMoney()}function updateMoney(){$('#paid').textContent=won(paid);$('#change').textContent=won(Math.max(0,paid-total()))}function finishCash(){if(paid<total())return alert('금액이 부족해요.');finish('cash',paid)}
function finish(method,amt){const no=Math.floor(100+Math.random()*900),res=mode==='mission'?checkMission(method):'',rows=cart.map(i=>`<div class="rl"><span>${i.name} x${i.qty}</span><span>${won(i.fp*i.qty)}</span></div>`).join('');$('#modal').innerHTML=`<div class="mh"><h3>주문 완료</h3><button class="x" onclick="resetOrder()">×</button></div><div class="mb">${res}<div class="receipt"><h2>${data[store].name}</h2><div style="text-align:center">키오스크 주문 연습</div><hr><div style="text-align:center">주문번호</div><div class="ord">${no}</div><hr>${rows}<hr><div class="rl"><b>합계</b><b>${won(total())}</b></div><div class="rl"><span>결제</span><span>${method==='cash'?'현금':'카드'}</span></div>${method==='cash'?`<div class="rl"><span>받은 금액</span><span>${won(amt)}</span></div><div class="rl"><span>거스름돈</span><span>${won(amt-total())}</span></div>`:''}</div><button class="primary" style="width:100%;margin-top:13px" onclick="resetOrder()">처음으로</button></div>`}function resetOrder(){closeM();cart=[];renderCart();if(mode==='mission')makeMission()}
function makeMission(){const all=items(),count=Math.random()<.55?1:2,p=[];while(p.length<count){const x=all[Math.floor(Math.random()*all.length)];if(!p.find(y=>y.id===x.id))p.push(x)}const its=p.map(x=>({id:x.id,name:x.name,temp:x.temp?(Math.random()<.5?'ICE':'HOT'):'없음',size:x.size?(Math.random()<.7?'보통':'큰 사이즈'):'없음'})),method=Math.random()<.5?'card':'cash';mission={items:its,method};$('#missionText').textContent=its.map(i=>`${i.temp!=='없음'?i.temp+' ':''}${i.name}${i.size==='큰 사이즈'?' 큰 사이즈':''}`).join(' + ')+`를 주문하고 ${method==='cash'?'현금':'카드'}으로 결제하세요.`;cart=[];renderCart()}function checkMission(method){const d=[...mission.items].sort((a,b)=>a.id.localeCompare(b.id)),a=[];cart.forEach(i=>{for(let q=0;q<i.qty;q++)a.push({id:i.id,temp:i.temp,size:i.size})});a.sort((x,y)=>x.id.localeCompare(y.id));const ok=d.length===a.length&&d.every((x,n)=>x.id===a[n].id&&x.temp===a[n].temp&&x.size===a[n].size)&&method===mission.method;speak(ok?'미션 성공! 아주 잘했어요.':'미션을 다시 확인해 보세요.');return `<div class="result ${ok?'ok':'bad'}">${ok?'미션 성공! 정확하게 주문했어요.':'미션을 다시 확인해 보세요.'}</div>`}function setMode(m){mode=m;$('#free').classList.toggle('active',m==='free');$('#missionBtn').classList.toggle('active',m==='mission');$('#mission').classList.toggle('show',m==='mission');cart=[];renderCart();if(m==='mission')makeMission()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}
$('#free').onclick=()=>setMode('free');$('#missionBtn').onclick=()=>setMode('mission');$('#newMission').onclick=makeMission;$('#hear').onclick=()=>speak($('#missionText').textContent);$('#checkout').onclick=checkout;$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
</script></body></html>
