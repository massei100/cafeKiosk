name: Replace menu photos with real food photography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-menu-photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow requests
      - name: Fetch curated real menu photographs from Wikimedia Commons
        run: |
          cat > /tmp/photos.py <<'PY'
          import os, requests, io, time
          from PIL import Image,ImageOps
          items={
          'cafe_americano.webp':('Americano coffee',['americano']), 'cafe_cafelatte.webp':('caffe latte',['latte']), 'cafe_vanillalatte.webp':('vanilla latte',['vanilla','latte']), 'cafe_caramelmacchiato.webp':('caramel macchiato',['caramel','macchiato']), 'cafe_cafemocha.webp':('cafe mocha',['mocha']), 'cafe_einspanner.webp':('Einspänner Kaffee',['einspänner']), 'cafe_strawberrysmoothie.webp':('strawberry smoothie',['strawberry','smoothie']), 'cafe_mangosmoothie.webp':('mango smoothie',['mango','smoothie']), 'cafe_blueberrysmoothie.webp':('blueberry smoothie',['blueberry','smoothie']), 'cafe_yogurtsmoothie.webp':('yogurt smoothie',['yogurt','smoothie']), 'cafe_lemontea.webp':('Lemon tea (2)',['lemon','tea']), 'cafe_grapefruittea.webp':('grapefruit tea',['grapefruit']), 'cafe_greentealatte.webp':('matcha latte',['matcha','latte']), 'cafe_chocolatelatte.webp':('hot chocolate drink',['hot','chocolate']), 'cafe_lemonade.webp':('lemonade drink',['lemonade']), 'cafe_grapefruitade.webp':('grapefruit drink',['grapefruit']), 'cafe_softicecream.webp':('soft serve ice cream',['soft serve']),
          'burger_bulgogiburger.webp':('bulgogi burger',['bulgogi']), 'burger_cheeseburger.webp':('cheeseburger',['cheeseburger']), 'burger_doublecheeseburger.webp':('double cheeseburger',['double','cheeseburger']), 'burger_baconburger.webp':('bacon cheeseburger',['bacon','burger']), 'burger_chickenburger.webp':('Chicken burger (33509114984)',['chicken','burger']), 'burger_shrimpburger.webp':('shrimp burger',['shrimp','burger']), 'burger_bulgogiset.webp':('hamburger fries soda meal',['burger','fries']), 'burger_cheeseburgerset.webp':('cheeseburger fries meal',['cheeseburger','fries']), 'burger_frenchfries.webp':('french fries',['fries']), 'burger_onionrings.webp':('onion rings',['onion','rings']), 'burger_cheesesticks.webp':('mozzarella sticks',['mozzarella','sticks']), 'burger_chickennuggets.webp':('chicken nuggets',['nuggets']), 'burger_cola.webp':('cola glass drink',['cola']), 'burger_cider.webp':('lemon lime soda glass',['lemon','lime','soda']), 'burger_softicecream.webp':('soft serve ice cream',['soft serve']),
          'bunsik_tteokbokki.webp':('Ddeokbokki-01',['ddeokbokki','tteokbokki']), 'bunsik_cheesetteokbokki.webp':('Cheese-tteok-bokki',['cheese','tteok']), 'bunsik_rosetteokbokki.webp':('rose tteokbokki',['tteokbokki']), 'bunsik_rabokki.webp':('rabokki',['rabokki']), 'bunsik_gimbap.webp':('gimbap',['gimbap','kimbap']), 'bunsik_tunagimbap.webp':('tuna gimbap',['gimbap','kimbap']), 'bunsik_cheesegimbap.webp':('cheese gimbap',['gimbap','kimbap']), 'bunsik_porkcutletgimbap.webp':('김가네김밥 행신역점 기본 김밥, 돈까스',['김밥','돈까스']), 'bunsik_assortedtempura.webp':('Korean twigim',['twigim','tempura']), 'bunsik_gimmari.webp':('gimmari',['gimmari']), 'bunsik_squidtempura.webp':('squid tempura',['squid','tempura']), 'bunsik_vegetabletempura.webp':('vegetable tempura',['vegetable','tempura']), 'bunsik_ramen.webp':('Ramyeon 1',['ramyeon']), 'bunsik_jjolmyeon.webp':('Jjolmyeon by keizie',['jjolmyeon']), 'bunsik_udon.webp':('udon noodles',['udon']), 'bunsik_cola.webp':('cola glass drink',['cola']), 'bunsik_cider.webp':('lemon lime soda glass',['lemon','lime','soda'])}
          api='https://commons.wikimedia.org/w/api.php'; headers={'User-Agent':'CafeKioskEducation/1.3 (educational project)'}; s=requests.Session(); s.headers.update(headers)
          def query(params):
            for wait in (1,2,4,8):
              try:
                r=s.get(api,params=params,timeout=30)
                if r.status_code in (429,503): time.sleep(wait); continue
                r.raise_for_status(); return r.json()
              except Exception: time.sleep(wait)
            return {}
          os.makedirs('assets-final',exist_ok=True); done=0; failed=[]
          for fn,(q,words) in items.items():
            params={'action':'query','generator':'search','gsrsearch':q+' filetype:bitmap','gsrnamespace':6,'gsrlimit':20,'prop':'imageinfo','iiprop':'url|size|mime','iiurlwidth':1600,'format':'json','formatversion':2,'maxlag':5}
            pages=query(params).get('query',{}).get('pages',[]); cand=[]
            for p in pages:
              title=p.get('title','').lower(); ii=(p.get('imageinfo') or [{}])[0]; u=ii.get('thumburl') or ii.get('url'); w=ii.get('width',0); h=ii.get('height',0); mime=ii.get('mime','')
              score=sum(1 for x in words if x.lower() in title)
              if u and mime.startswith('image/') and w>=650 and h>=450 and score: cand.append((score,w*h,u,p.get('title','')))
            cand.sort(reverse=True); saved=False
            for _,__,url,title in cand:
              try:
                r=s.get(url,timeout=60); r.raise_for_status(); im=Image.open(io.BytesIO(r.content)); im.load()
                im=ImageOps.fit(im.convert('RGB'),(1200,900),Image.Resampling.LANCZOS); im.save('assets-final/'+fn,'WEBP',quality=90,method=6)
                print('SAVED',fn,'<-',title); done+=1; saved=True; break
              except Exception as e: print('SKIP',fn,type(e).__name__)
            if not saved: failed.append(fn); print('FAILED',fn)
            time.sleep(1.2)
          print('TOTAL',done,'OF',len(items),'FAILED',','.join(failed))
          if failed: raise SystemExit('Not committing incomplete photo set')
          PY
          python /tmp/photos.py
      - name: Commit real photo assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets-final
          git diff --cached --quiet && exit 0
          git commit -m "Replace kiosk menu assets with curated real food photographs"
          git push
