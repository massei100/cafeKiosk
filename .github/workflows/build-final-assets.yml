name: Build final menu assets
on:
  push:
    branches: [final-assets-build]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract independent menu image files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, sys
          sources=['webp1.js','webp3.js','webp4.js','webp5.js','webp6.js']
          data={}
          pat=re.compile(r'\"([^\"]+\.webp)\":\"data:image/webp;base64,([^\"]+)\"')
          for src in sources:
              text=Path(src).read_text(encoding='utf-8')
              for name,b64 in pat.findall(text):
                  data[name]=b64
          required='''cafe_americano.webp cafe_cafelatte.webp cafe_vanillalatte.webp cafe_caramelmacchiato.webp cafe_cafemocha.webp cafe_einspanner.webp cafe_strawberrysmoothie.webp cafe_mangosmoothie.webp cafe_blueberrysmoothie.webp cafe_yogurtsmoothie.webp cafe_lemontea.webp cafe_grapefruittea.webp cafe_greentealatte.webp cafe_chocolatelatte.webp cafe_lemonade.webp burger_bulgogiburger.webp burger_cheeseburger.webp burger_doublecheeseburger.webp burger_baconburger.webp burger_chickenburger.webp burger_shrimpburger.webp burger_bulgogiset.webp burger_cheeseburgerset.webp burger_frenchfries.webp burger_onionrings.webp burger_cheesesticks.webp burger_chickennuggets.webp burger_cola.webp burger_cider.webp burger_softicecream.webp bunsik_tteokbokki.webp bunsik_cheesetteokbokki.webp bunsik_rosetteokbokki.webp bunsik_rabokki.webp bunsik_gimbap.webp bunsik_tunagimbap.webp bunsik_cheesegimbap.webp bunsik_porkcutletgimbap.webp bunsik_assortedtempura.webp bunsik_gimmari.webp bunsik_squidtempura.webp bunsik_vegetabletempura.webp bunsik_ramen.webp bunsik_jjolmyeon.webp bunsik_udon.webp'''.split()
          missing=[x for x in required if x not in data]
          if missing:
              print('MISSING:',missing)
              sys.exit(2)
          out=Path('assets-final'); out.mkdir(exist_ok=True)
          for name in required:
              raw=base64.b64decode(data[name])
              (out/name).write_bytes(raw)
              print(name,len(raw))
          PY
      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets-final
          git commit -m "Generate independent final menu images" || exit 0
          git push
