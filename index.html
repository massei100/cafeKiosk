<!doctype html>
<html lang="ko">
<head>

<title>키오스크 주문 연습</title>
<style>
:root{--bg:#fff9f4;--card:#fff;--ink:#241913;--muted:#786a61;--accent:#7b4d35;--accent2:#a76a49;--soft:#f2e4d8;--line:#eaded4;--shadow:0 12px 30px rgba(74,42,25,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:28px 18px 56px}.homeHead{text-align:center;margin:12px 0 28px}.homeHead h1{font-size:clamp(2.2rem,5vw,4rem);margin:0;font-weight:1000;letter-spacing:-.04em}.homeHead p{margin:12px 0 0;color:var(--muted);font-size:1.1rem;font-weight:850}.storeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.storeCard{border:0;background:var(--card);border-radius:30px;overflow:hidden;box-shadow:var(--shadow);padding:0;text-align:left;cursor:pointer;transition:.18s transform}.storeCard:active{transform:scale(.985)}.storeVisual{height:280px;padding:22px;display:grid;grid-template-columns:1.35fr .9fr;grid-template-rows:1fr 1fr;gap:10px;background:linear-gradient(145deg,#fff3e8,#fbe6d4)}.storeVisual .tile{background:rgba(255,255,255,.74);border-radius:20px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}.storeVisual .tile:first-child{grid-row:1/3}.storeBody{padding:22px 22px 24px}.storeName{font-size:1.9rem;font-weight:1000}.storeDesc{color:var(--muted);font-weight:800;line-height:1.45;margin-top:8px}.storeGo{display:inline-block;background:var(--accent);color:white;border-radius:14px;padding:12px 18px;margin-top:16px;font-weight:950}.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(9px);border-bottom:1px solid #eee}.topInner{max-width:1220px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:12px}.brand{font-size:1.35rem;font-weight:1000;margin-right:auto}.backBtn,.modeBtn{border:0;border-radius:16px;padding:11px 15px;font-weight:950;background:var(--soft);color:var(--accent);cursor:pointer}.modeBtn.on{background:var(--accent);color:#fff}.modeBtns{display:flex;gap:8px}.main{max-width:1220px;margin:auto;padding:16px 14px 48px}.practiceRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.practiceCard{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;min-height:70px}.guideCard span{font-weight:900;color:var(--accent)}.segBtns{margin-left:auto;display:flex;gap:6px}.segBtns button{border:0;border-radius:13px;padding:10px 16px;background:#f1ece8;color:#74665d;font-weight:900}.segBtns button.on{background:var(--accent);color:white}.missionBox{background:#fff5d8;border:2px solid #eccb67;border-radius:18px;padding:14px 16px;margin-bottom:12px}.missionLabel{font-weight:950;color:#9b6a17}.missionText{font-size:1.08rem;font-weight:950;line-height:1.5;margin-top:5px}.missionActions{display:flex;gap:8px;margin-top:10px}.missionActions button{border:0;border-radius:12px;padding:9px 12px;background:white;font-weight:900;color:#8a641f}.workspace{display:grid;grid-template-columns:150px minmax(0,1fr) 310px;gap:14px;align-items:start}.categoryPanel,.menuPanel,.cartPanel{background:#fff;border-radius:24px;box-shadow:var(--shadow)}.categoryPanel{padding:11px}.catList{display:flex;flex-direction:column;gap:8px}.catBtn{border:0;border-radius:14px;padding:13px 9px;background:var(--soft);font-weight:950;color:var(--accent);cursor:pointer}.catBtn.on{background:var(--accent);color:white}.menuPanel{padding:15px}.menuHead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px}.menuHead h2{font-size:2rem;margin:0}.menuHead span{color:var(--muted);font-size:.9rem;font-weight:750}.menuGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.menuCard{border:0;background:#fff;border-radius:20px;overflow:hidden;padding:0;text-align:left;box-shadow:0 6px 18px rgba(55,35,25,.08);cursor:pointer}.menuPic{aspect-ratio:4/3;background:linear-gradient(145deg,#fff9f4,#f6ebe3);display:grid;place-items:center;padding:8px}.menuPic svg{width:100%;height:100%;max-width:280px;max-height:210px}.menuTxt{padding:11px 12px 14px}.menuName{font-size:1.05rem;font-weight:1000;line-height:1.2}.menuPrice{font-weight:1000;color:var(--accent);margin-top:6px}.cartPanel{padding:15px;position:sticky;top:76px}.cartPanel h2{font-size:1.9rem;margin:0 0 12px}.empty{padding:28px 10px;text-align:center;color:#9b8c83;font-weight:800}.cartRow{background:#faf6f2;border-radius:14px;padding:11px;margin-bottom:8px}.cartLine{display:flex;justify-content:space-between;gap:8px;font-weight:950}.cartOpt{font-size:.8rem;color:var(--muted);margin-top:3px}.qty{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px}.qty button{width:31px;height:31px;border:0;border-radius:50%;background:white;box-shadow:inset 0 0 0 1px #e2d7cf;font-size:1.1rem;font-weight:1000}.totalLine{display:flex;justify-content:space-between;border-top:2px dashed var(--line);padding-top:14px;margin-top:12px;font-size:1.22rem;font-weight:1000}.payBtn,.primary{width:100%;border:0;border-radius:15px;padding:14px;background:var(--accent);color:white;font-weight:1000;margin-top:11px}.payBtn:disabled{opacity:.4}.overlay{position:fixed;inset:0;background:rgba(27,20,16,.56);display:flex;align-items:center;justify-content:center;padding:14px;z-index:99}.modal{width:min(620px,100%);max-height:93vh;overflow:auto;background:white;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.25)}.modalHead{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid #eee}.modalHead h3{margin:0;font-size:1.5rem}.close{border:0;width:40px;height:40px;border-radius:50%;background:#f3efec;font-size:1.5rem}.modalBody{padding:18px}.detailPic{height:260px;border-radius:20px;background:linear-gradient(145deg,#fff9f4,#f5e9e0);display:grid;place-items:center;padding:12px;margin-bottom:16px}.detailPic svg{width:100%;height:100%;max-width:420px}.group{margin-top:14px}.group b{display:block;margin-bottom:8px}.opts,.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt,.method{border:2px solid var(--line);background:white;border-radius:14px;padding:13px 10px;font-weight:950}.opt.sel{border-color:var(--accent);background:var(--soft);color:var(--accent)}.method{padding:22px 10px}.summary{background:#faf6f2;border-radius:15px;padding:13px;line-height:1.7;margin-top:12px}.cashGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.cashGrid button{border:0;border-radius:12px;padding:12px;background:var(--soft);color:var(--accent);font-weight:950}.actions{display:flex;gap:8px;margin-top:12px}.secondary{flex:1;border:0;border-radius:14px;padding:13px;background:#eee;font-weight:950}.receipt{width:min(370px,100%);margin:auto;background:#fffefb;border:1px solid #ddd;padding:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.receipt h4{text-align:center;font-size:1.3rem;margin:0 0 4px}.receipt p{text-align:center;margin:0}.receipt hr{border:0;border-top:1px dashed #999;margin:11px 0}.rline{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.orderNo{text-align:center;font-size:2rem;font-weight:1000;color:var(--accent)}.result{text-align:center;font-weight:1000;margin-bottom:12px}.ok{color:#2d9653}.bad{color:#c43d35}
body.cafe{--accent:#7b4d35;--accent2:#a76a49;--soft:#f2e4d8;--bg:#fff9f4}body.burger{--accent:#e25a18;--accent2:#ff8a21;--soft:#ffe4ce;--bg:#fff8ef}body.bunsik{--accent:#e43b42;--accent2:#ff6c57;--soft:#ffdfe0;--bg:#fff7f6}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.categoryPanel{overflow:auto}.catList{flex-direction:row;overflow:auto}.catBtn{min-width:92px}.cartPanel{position:static}.menuGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.wrap{padding:20px 14px 44px}.storeGrid{grid-template-columns:1fr}.storeVisual{height:250px}.topInner{flex-wrap:wrap}.brand{order:3;width:100%;font-size:1.25rem;padding:2px 3px}.backBtn,.modeBtn{padding:10px 12px}.main{padding:12px 10px 36px}.practiceRow{grid-template-columns:1fr}.practiceCard{min-height:62px}.menuPanel{padding:11px}.menuGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.menuPic{padding:5px}.menuHead h2{font-size:1.65rem}.menuHead span{display:none}.menuName{font-size:1rem}.cartPanel h2{font-size:1.65rem}.detailPic{height:230px}.storeVisual{padding:16px}}
</style>

<body>
<section id="home" class="wrap"><div class="homeHead"><h1>어디에서 주문할까요?</h1><p>연습할 가게를 선택하세요.</p></div><div id="storeGrid" class="storeGrid"></div></section>
<section id="app" class="hidden"><header class="topbar"><div class="topInner"><button class="backBtn" onclick="goHome()">← 가게 선택</button><div id="brand" class="brand"></div><div class="modeBtns"><button id="freeBtn" class="modeBtn on" onclick="setMode('free')">자유 연습</button><button id="missionBtn" class="modeBtn" onclick="setMode('mission')">미션 연습</button></div></div></header><main class="main"><section class="practiceRow"><div class="practiceCard"><strong>어디에서 드시나요?</strong><div class="segBtns"><button id="dineBtn" class="on" onclick="setOrderType('매장')">매장</button><button id="takeBtn" onclick="setOrderType('포장')">포장</button></div></div><div class="practiceCard guideCard"><strong>현재 연습</strong><span id="modeGuide">자유롭게 주문해 보세요.</span></div></section><section id="missionBox" class="missionBox hidden"><div class="missionLabel">오늘의 주문 미션</div><div id="missionText" class="missionText"></div><div class="missionActions"><button onclick="newMission()">새 미션</button><button onclick="speakMission()">다시 듣기</button></div></section><div class="workspace"><aside class="categoryPanel"><div id="catList" class="catList"></div></aside><section class="menuPanel"><div class="menuHead"><h2 id="catTitle"></h2><span>메뉴를 눌러 주문하세요.</span></div><div id="menuGrid" class="menuGrid"></div></section><aside class="cartPanel"><h2>장바구니</h2><div id="cartBox"></div><div class="totalLine"><span>총 금액</span><strong id="total">0원</strong></div><button id="payBtn" class="payBtn" disabled onclick="openPayment()">결제하기</button></aside></div></main></section><div id="modal"></div>
<script>
const G=(a,b)=>`<defs><linearGradient id="g${a}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7a4a2a" flood-opacity=".18"/></filter></defs>`;
function cup(liq='#70402b',cream=false,straw=false,fruit='',ice=true){return `<svg viewBox="0 0 320 240" aria-hidden="true">${G(liq,'#3f2319')}<ellipse cx="160" cy="205" rx="82" ry="15" fill="#d9c3b5" opacity=".45"/><g filter="url(#s)"><path d="M95 58h130l-13 132q-2 18-20 18h-64q-18 0-20-18z" fill="#f7fbfc" stroke="#d4e1e4" stroke-width="7"/><path d="M106 74h108l-11 107q-2 13-14 13h-58q-12 0-14-13z" fill="url(#g${liq})"/>${ice?'<g fill="#fff" opacity=".72"><rect x="120" y="86" width="28" height="20" rx="5" transform="rotate(-12 134 96)"/><rect x="156" y="80" width="29" height="21" rx="5" transform="rotate(8 170 90)"/><rect x="185" y="101" width="27" height="20" rx="5" transform="rotate(-7 198 111)"/><rect x="137" y="116" width="26" height="18" rx="5"/></g>':''}${cream?'<path d="M111 81c10-29 30-34 44-24 10-20 41-14 42 8 21-4 31 20 16 31H111c-15-7-13-11 0-15z" fill="#fff8ef"/><path d="M128 75c15-9 47-7 67 7" fill="none" stroke="#d99b65" stroke-width="5" stroke-linecap="round"/>':''}${fruit?`<circle cx="203" cy="72" r="14" fill="${fruit}"/><circle cx="211" cy="65" r="5" fill="#fff" opacity=".55"/>`:''}${straw?'<path d="M189 60l9-42" stroke="#2f9b75" stroke-width="8" stroke-linecap="round"/>':''}<path d="M121 91v72" stroke="#fff" opacity=".35" stroke-width="7" stroke-linecap="round"/></g></svg>`}
function mug(liq='#c88658',foam=true,swirl=true){return `<svg viewBox="0 0 320 240">${G('#fff','#e6d4c4')}<ellipse cx="150" cy="205" rx="82" ry="14" fill="#d8c4b7" opacity=".45"/><g filter="url(#s)"><path d="M86 75h125v98q0 31-30 31h-65q-30 0-30-31z" fill="#fffaf4" stroke="#eadfd5" stroke-width="6"/><path d="M211 96h22q34 0 34 36t-36 36h-20" fill="none" stroke="#eadfd5" stroke-width="13"/><path d="M99 91h99v78q0 20-20 20h-59q-20 0-20-20z" fill="${liq}"/>${foam?'<ellipse cx="149" cy="94" rx="50" ry="17" fill="#fff8ef"/>':''}${swirl?'<path d="M117 94c16-22 63-21 68 0-14 15-55 18-68 0zm13-2c11-10 32-11 42 0-9 9-31 10-42 0z" fill="none" stroke="#b97042" stroke-width="4" stroke-linecap="round"/>':''}<path d="M110 111v53" stroke="#fff" opacity=".28" stroke-width="6" stroke-linecap="round"/></g></svg>`}
function smoothie(color='#ef6b82',accent='#d33f62'){return `<svg viewBox="0 0 320 240">${G(color,accent)}<ellipse cx="160" cy="208" rx="78" ry="14" fill="#d6c2b6" opacity=".42"/><g filter="url(#s)"><path d="M103 48h114l-12 145q-1 15-16 15h-58q-15 0-16-15z" fill="#f6fafb" stroke="#dce8ea" stroke-width="6"/><path d="M114 67h92l-10 119q-1 9-10 9h-50q-9 0-10-9z" fill="url(#g${color})"/><path d="M184 59l9-43" stroke="#338d6e" stroke-width="8" stroke-linecap="round"/><path d="M123 87c26-13 53-16 75-5" stroke="#fff" stroke-width="7" opacity=".28" stroke-linecap="round"/></g></svg>`}
function burger(kind='beef'){let patty=kind==='chicken'?'#d79544':kind==='shrimp'?'#ef9b70':'#5a2e22';return `<svg viewBox="0 0 320 240">${G('#f6b343','#d98728')}<ellipse cx="160" cy="207" rx="100" ry="17" fill="#d4b59e" opacity=".45"/><g filter="url(#s)"><path d="M69 102c9-47 45-72 91-72s83 25 91 72z" fill="url(#g#f6b343)"/><g fill="#fff1b4"><ellipse cx="113" cy="61" rx="7" ry="4"/><ellipse cx="149" cy="48" rx="7" ry="4"/><ellipse cx="189" cy="60" rx="7" ry="4"/><ellipse cx="211" cy="77" rx="7" ry="4"/></g><path d="M78 111c18-18 31-8 45-17 13 16 28 7 42 18 14-17 30-7 45-17 11 11 23 8 32 16l-8 21H86z" fill="#56a943"/><path d="M84 132h153v17H84z" fill="#e34f3f"/><path d="M88 147h145v19H88z" fill="#ffd74d"/><rect x="82" y="163" width="157" height="28" rx="14" fill="${patty}"/>${kind==='double'?'<rect x="87" y="137" width="147" height="20" rx="10" fill="#5a2e22"/><path d="M92 153h137v14H92z" fill="#ffd74d"/>':''}<path d="M72 191h176l-12 24H84z" fill="#df963a"/></g></svg>`}
function fries(type='fries'){if(type==='rings')return `<svg viewBox="0 0 320 240">${G('#f5b44d','#d98721')}<ellipse cx="160" cy="207" rx="92" ry="15" fill="#d7c0af" opacity=".45"/><g filter="url(#s)" fill="none" stroke="url(#g#f5b44d)" stroke-width="18"><ellipse cx="118" cy="123" rx="46" ry="38"/><ellipse cx="177" cy="111" rx="49" ry="41"/><ellipse cx="196" cy="154" rx="44" ry="35"/></g></svg>`;let pieces=type==='sticks'?'<g fill="url(#g#f5b44d)" filter="url(#s)"><rect x="75" y="95" width="42" height="92" rx="18" transform="rotate(-18 96 141)"/><rect x="124" y="78" width="42" height="108" rx="18" transform="rotate(8 145 132)"/><rect x="175" y="91" width="42" height="100" rx="18" transform="rotate(18 196 141)"/><path d="M145 129c12 12 24 28 34 46" stroke="#fff7d4" stroke-width="9" fill="none" stroke-linecap="round"/></g>':'<g fill="url(#g#f5b44d)" filter="url(#s)"><rect x="91" y="48" width="20" height="111" rx="7" transform="rotate(-11 101 103)"/><rect x="119" y="37" width="20" height="126" rx="7" transform="rotate(-4 129 100)"/><rect x="148" y="42" width="20" height="119" rx="7" transform="rotate(4 158 101)"/><rect x="177" y="34" width="20" height="129" rx="7" transform="rotate(9 187 99)"/><rect x="204" y="51" width="20" height="110" rx="7" transform="rotate(15 214 106)"/></g>';return `<svg viewBox="0 0 320 240">${G('#f5b44d','#d98721')}<ellipse cx="160" cy="207" rx="83" ry="15" fill="#d7c0af" opacity=".45"/>${pieces}<path d="M82 138h156l-18 76H100z" fill="#e44739" filter="url(#s)"/></svg>`}
function nuggets(){return `<svg viewBox="0 0 320 240">${G('#e2a14a','#bb6b29')}<ellipse cx="160" cy="207" rx="93" ry="15" fill="#d7c0af" opacity=".42"/><g fill="url(#g#e2a14a)" filter="url(#s)"><path d="M73 144q-9-38 32-52t61 17q18 27-6 50t-53 18q-27-5-34-33z"/><path d="M148 89q9-39 50-38t51 35q8 31-20 48t-56 4q-32-14-25-49z"/><path d="M168 151q10-34 43-29t39 34q5 25-19 39t-46 3q-27-12-17-47z"/></g><circle cx="90" cy="182" r="24" fill="#d13a2f"/><path d="M77 184c11-10 23-10 33 0" stroke="#ffb0a8" stroke-width="5" fill="none"/></svg>`}
function softserve(){return `<svg viewBox="0 0 320 240">${G('#fff8ef','#f1d6bc')}<ellipse cx="160" cy="211" rx="70" ry="12" fill="#d5bba8" opacity=".4"/><g filter="url(#s)"><path d="M118 113h84l-16 98h-52z" fill="#d99843"/><path d="M129 183h62M134 163h52M139 143h42" stroke="#b96e2a" stroke-width="4" opacity=".7"/><path d="M121 112c-19-12-8-32 12-31-14-20 6-35 25-25 8-24 39-21 44 1 24-4 34 24 14 35 17 17 0 35-18 31h-65c-15 0-22-5-12-11z" fill="#fffaf3"/></g></svg>`}
function tteok(type='red'){let sauce=type==='rose'?'#f08d76':'#d9362b', cheese=type==='cheese';return `<svg viewBox="0 0 320 240">${G(sauce,'#9f1e19')}<ellipse cx="160" cy="207" rx="105" ry="17" fill="#d7b9a5" opacity=".45"/><g filter="url(#s)"><path d="M55 117h210q-12 84-73 91h-64q-61-7-73-91z" fill="#f6f2ee" stroke="#e2d3c9" stroke-width="6"/><ellipse cx="160" cy="118" rx="100" ry="39" fill="url(#g${sauce})"/>${[80,115,150,185,220].map((x,i)=>`<rect x="${x}" y="${95+(i%2)*16}" width="44" height="17" rx="8" fill="#f7d9a1" transform="rotate(${i%2?8:-8} ${x+22} ${110})"/>`).join('')}${cheese?'<path d="M92 93q65-45 136 0-25 27-67 26t-69-26z" fill="#ffd95d" opacity=".92"/>':''}${type==='rabokki'?'<path d="M92 103c22-25 44 20 66-2s44 17 68-5" fill="none" stroke="#f2c86b" stroke-width="7" stroke-linecap="round"/>':''}<circle cx="183" cy="92" r="6" fill="#4d9b50"/><circle cx="205" cy="105" r="5" fill="#4d9b50"/></g></svg>`}

let store=null,cat=null,mode='free',orderType='매장',cart=[],mission=null,money=0;const $=id=>document.getElementById(id),won=n=>n.toLocaleString('ko-KR')+'원';
function renderHome(){$('storeGrid').innerHTML=Object.entries(STORES).map(([k,v])=>`<button class="storeCard" onclick="enterStore('${k}')"><div class="storeVisual">${v.hero.map((f,i)=>`<div class="tile">${f()}</div>`).join('')}</div><div class="storeBody"><div class="storeName">${v.title}</div><div class="storeDesc">${v.desc}</div><span class="storeGo">주문하기</span></div></button>`).join('')}
function enterStore(k){store=k;cat=Object.keys(STORES[k].cats)[0];cart=[];document.body.className=k;$('home').classList.add('hidden');$('app').classList.remove('hidden');$('brand').textContent=STORES[k].title+' 키오스크';setMode('free');setOrderType('매장');renderCats();renderMenu();renderCart()}
function goHome(){$('app').classList.add('hidden');$('home').classList.remove('hidden');document.body.className='';closeModal()}
function setMode(m){mode=m;$('freeBtn').classList.toggle('on',m==='free');$('missionBtn').classList.toggle('on',m==='mission');$('missionBox').classList.toggle('hidden',m!=='mission');$('modeGuide').textContent=m==='free'?'자유롭게 주문해 보세요.':'미션을 보고 정확하게 주문해 보세요.';if(m==='mission')newMission()}
function setOrderType(t){orderType=t;$('dineBtn').classList.toggle('on',t==='매장');$('takeBtn').classList.toggle('on',t==='포장')}
function renderCats(){$('catList').innerHTML=Object.keys(STORES[store].cats).map(c=>`<button class="catBtn ${c===cat?'on':''}" onclick="chooseCat('${c}')">${c}</button>`).join('')}
function chooseCat(c){cat=c;renderCats();renderMenu()}
function renderMenu(){$('catTitle').textContent=cat;$('menuGrid').innerHTML=STORES[store].cats[cat].map((x,i)=>`<button class="menuCard" onclick="openItem('${cat}',${i})"><div class="menuPic">${x.art()}</div><div class="menuTxt"><div class="menuName">${x.n}</div><div class="menuPrice">${won(x.p)}${x.s?'~':''}</div></div></button>`).join('')}
function openItem(c,i){const x=STORES[store].cats[c][i],state={temp:x.t?'ICE':'없음',size:x.s?'보통':'없음'};openModal(`<div class="modalHead"><h3>${x.n}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalBody"><div class="detailPic">${x.art()}</div>${x.t?`<div class="group"><b>온도를 선택하세요</b><div class="opts"><button class="opt sel" data-role="temp" data-value="ICE">ICE</button><button class="opt" data-role="temp" data-value="HOT">HOT</button></div></div>`:''}${x.s?`<div class="group"><b>크기를 선택하세요</b><div class="opts"><button class="opt sel" data-role="size" data-value="보통">보통</button><button class="opt" data-role="size" data-value="큰 사이즈">큰 사이즈 +500원</button></div></div>`:''}<button id="addCartBtn" class="primary">장바구니에 담기</button></div>`,root=>{root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state[b.dataset.role]=b.dataset.value;root.querySelectorAll(`[data-role="${b.dataset.role}"]`).forEach(q=>q.classList.remove('sel'));b.classList.add('sel')});root.querySelector('#addCartBtn').onclick=()=>{addCart(x,state);closeModal()}})}
function addCart(x,s){let p=x.p+(s.size==='큰 사이즈'?500:0),key=[x.n,s.temp,s.size].join('|'),z=cart.find(v=>v.key===key);z?z.q++:cart.push({key,n:x.n,p,temp:s.temp,size:s.size,q:1});renderCart()}
function renderCart(){let t=total();$('cartBox').innerHTML=cart.length?cart.map((x,i)=>`<div class="cartRow"><div class="cartLine"><span>${x.n}</span><span>${won(x.p*x.q)}</span></div><div class="cartOpt">${[x.temp!=='없음'?x.temp:'',x.size!=='없음'?x.size:''].filter(Boolean).join(' · ')}</div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${x.q}</b><button onclick="qty(${i},1)">+</button></div></div>`).join(''):'<div class="empty">메뉴를 선택해 주세요.</div>';$('total').textContent=won(t);$('payBtn').disabled=!cart.length}
function qty(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);renderCart()}function total(){return cart.reduce((a,x)=>a+x.p*x.q,0)}function allItems(){return Object.values(STORES[store].cats).flat()}
function newMission(){let items=allItems(),r=Math.random(),pay=Math.random()<.5?'카드':'현금';if(r<.38){let x=items[Math.floor(Math.random()*items.length)];mission={type:'exact',items:[x.n],pay,ot:Math.random()<.5?'매장':'포장'};$('missionText').textContent=`${mission.ot}에서 ${x.n} 1개를 주문하고 ${pay}로 결제하세요.`}else if(r<.72){let a=items[Math.floor(Math.random()*items.length)],b=items[Math.floor(Math.random()*items.length)];while(b.n===a.n)b=items[Math.floor(Math.random()*items.length)];mission={type:'exact',items:[a.n,b.n],pay,ot:'포장'};$('missionText').textContent=`포장으로 ${a.n} 1개와 ${b.n} 1개를 주문하고 ${pay}로 결제하세요.`}else{mission={type:'budget',budget:10000,min:3,pay,ot:'매장'};$('missionText').textContent=`매장에서 10,000원 안으로 서로 다른 메뉴를 3개 이상 주문하고 ${pay}로 결제하세요.`}}
function speakMission(){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('missionText').textContent);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}
function openPayment(){openModal(`<div class="modalHead"><h3>결제 방법을 선택하세요</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalBody"><div class="methods"><button id="cardPayBtn" class="method">카드 결제</button><button id="cashPayBtn" class="method">현금 결제</button></div><div class="summary"><b>결제할 금액</b><br><span style="font-size:1.5rem;font-weight:1000">${won(total())}</span></div></div>`,root=>{root.querySelector('#cardPayBtn').onclick=cardPay;root.querySelector('#cashPayBtn').onclick=cashPay})}
function cardPay(){openModal(`<div class="modalHead"><h3>카드 결제</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalBody"><div style="height:180px;display:grid;place-items:center"><div style="width:220px;height:132px;border-radius:18px;background:linear-gradient(135deg,#254461,#5d7c96);transform:rotate(-7deg);box-shadow:0 16px 30px #0002;position:relative"><div style="width:34px;height:24px;border-radius:5px;background:#e5ce72;position:absolute;left:24px;top:44px"></div><b style="position:absolute;left:24px;bottom:18px;color:#fff;letter-spacing:2px">CARD</b></div></div><button class="primary" onclick="finishPay('카드',${total()})">카드 결제 완료</button></div>`)}
function cashPay(){money=0;openModal(`<div class="modalHead"><h3>현금 결제</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalBody"><b>돈을 눌러 금액을 맞춰보세요.</b><div class="cashGrid">${[100,500,1000,5000,10000,50000].map(v=>`<button onclick="addMoney(${v})">${won(v)}</button>`).join('')}</div><div class="summary"><div>상품 금액: <b>${won(total())}</b></div><div>낸 금액: <b id="paidMoney">0원</b></div><div>거스름돈: <b id="changeMoney">0원</b></div></div><div class="actions"><button class="secondary" onclick="money=0;updateMoney()">다시 내기</button><button class="primary" style="margin-top:0;flex:1" onclick="finishCash()">결제하기</button></div></div>`)}
function addMoney(v){money+=v;updateMoney()}function updateMoney(){$('paidMoney').textContent=won(money);$('changeMoney').textContent=won(Math.max(0,money-total()))}function finishCash(){if(money<total())return alert('금액이 부족해요.');finishPay('현금',money)}
function missionOK(method){if(mode!=='mission'||!mission)return true;if(method!==mission.pay||orderType!==mission.ot)return false;let names=[];cart.forEach(x=>{for(let i=0;i<x.q;i++)names.push(x.n)});if(mission.type==='exact')return names.length===mission.items.length&&mission.items.every(n=>names.includes(n));return total()<=mission.budget&&new Set(names).size>=mission.min}
function finishPay(method,paid){let ok=missionOK(method),no=Math.floor(1000+Math.random()*9000);openModal(`<div class="modalHead"><h3>주문 완료</h3><button class="close" onclick="resetAfter()">×</button></div><div class="modalBody">${mode==='mission'?`<div class="result ${ok?'ok':'bad'}">${ok?'미션 성공! 정확하게 주문했어요.':'미션 조건과 달라요. 다시 도전해 보세요.'}</div>`:''}<div class="receipt"><h4>${STORES[store].title}</h4><p>${orderType} 주문</p><hr>${cart.map(x=>`<div class="rline"><span>${x.n} × ${x.q}</span><span>${won(x.p*x.q)}</span></div>`).join('')}<hr><div class="rline"><b>합계</b><b>${won(total())}</b></div><div class="rline"><span>결제</span><span>${method}</span></div>${method==='현금'?`<div class="rline"><span>받은 금액</span><span>${won(paid)}</span></div><div class="rline"><span>거스름돈</span><span>${won(paid-total())}</span></div>`:''}<hr><div class="orderNo">${no}</div></div><button class="primary" onclick="resetAfter()">새 주문 시작</button></div>`)}
function resetAfter(){closeModal();cart=[];renderCart();if(mode==='mission')newMission()}function openModal(html,after){$('modal').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`;if(after)after($('modal'))}function closeModal(){$('modal').innerHTML=''}
renderHome();
</script>
