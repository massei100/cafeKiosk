name: Replace menu photos with real food photography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-menu-photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow requests
      - name: Fetch real menu photographs from Wikimedia Commons
        run: |
          cat > /tmp/photos.py <<'PY'
          import os, requests, io, time
          from PIL import Image,ImageOps
          items={
          'cafe_americano.webp':'Americano coffee photograph','cafe_cafelatte.webp':'caffe latte coffee photograph','cafe_vanillalatte.webp':'vanilla latte coffee photograph','cafe_caramelmacchiato.webp':'caramel macchiato coffee photograph','cafe_cafemocha.webp':'cafe mocha coffee photograph','cafe_einspanner.webp':'Einspanner coffee Vienna photograph','cafe_strawberrysmoothie.webp':'strawberry smoothie photograph','cafe_mangosmoothie.webp':'mango smoothie photograph','cafe_blueberrysmoothie.webp':'blueberry smoothie photograph','cafe_yogurtsmoothie.webp':'yogurt smoothie photograph','cafe_lemontea.webp':'lemon tea photograph','cafe_grapefruittea.webp':'grapefruit tea photograph','cafe_greentealatte.webp':'matcha latte photograph','cafe_chocolatelatte.webp':'hot chocolate latte photograph','cafe_lemonade.webp':'lemonade glass photograph','cafe_grapefruitade.webp':'grapefruit soda drink photograph','cafe_softicecream.webp':'soft serve ice cream photograph',
          'burger_bulgogiburger.webp':'bulgogi burger Korean photograph','burger_cheeseburger.webp':'cheeseburger photograph','burger_doublecheeseburger.webp':'double cheeseburger photograph','burger_baconburger.webp':'bacon cheeseburger photograph','burger_chickenburger.webp':'chicken burger photograph','burger_shrimpburger.webp':'shrimp burger photograph','burger_bulgogiset.webp':'burger french fries soda meal photograph','burger_cheeseburgerset.webp':'cheeseburger french fries soda meal photograph','burger_frenchfries.webp':'french fries photograph','burger_onionrings.webp':'onion rings food photograph','burger_cheesesticks.webp':'mozzarella sticks photograph','burger_chickennuggets.webp':'chicken nuggets photograph','burger_cola.webp':'cola glass photograph','burger_cider.webp':'lemon lime soda glass photograph','burger_softicecream.webp':'soft serve ice cream photograph',
          'bunsik_tteokbokki.webp':'tteokbokki Korean food photograph','bunsik_cheesetteokbokki.webp':'cheese tteokbokki photograph','bunsik_rosetteokbokki.webp':'cream rose tteokbokki photograph','bunsik_rabokki.webp':'rabokki Korean food photograph','bunsik_gimbap.webp':'gimbap Korean food photograph','bunsik_tunagimbap.webp':'tuna gimbap photograph','bunsik_cheesegimbap.webp':'cheese gimbap Korean photograph','bunsik_porkcutletgimbap.webp':'pork cutlet gimbap photograph','bunsik_assortedtempura.webp':'Korean assorted twigim fried food photograph','bunsik_gimmari.webp':'gimmari Korean fried seaweed roll photograph','bunsik_squidtempura.webp':'fried squid tempura photograph','bunsik_vegetabletempura.webp':'vegetable tempura photograph','bunsik_ramen.webp':'Korean ramyeon noodles photograph','bunsik_jjolmyeon.webp':'jjolmyeon Korean noodles photograph','bunsik_udon.webp':'udon noodles photograph','bunsik_cola.webp':'cola glass photograph','bunsik_cider.webp':'lemon lime soda glass photograph'}
          api='https://commons.wikimedia.org/w/api.php'; headers={'User-Agent':'CafeKioskEducation/1.0'}
          os.makedirs('assets-final',exist_ok=True)
          for fn,q in items.items():
            params={'action':'query','generator':'search','gsrsearch':q+' filetype:bitmap','gsrnamespace':6,'gsrlimit':10,'prop':'imageinfo','iiprop':'url|size|mime','format':'json','origin':'*'}
            data=requests.get(api,params=params,headers=headers,timeout=30).json(); pages=list(data.get('query',{}).get('pages',{}).values())
            cand=[]
            for p in pages:
              ii=(p.get('imageinfo') or [{}])[0]; mime=ii.get('mime',''); w=ii.get('width',0); h=ii.get('height',0); u=ii.get('url')
              if u and mime in ('image/jpeg','image/png') and w>=700 and h>=500: cand.append((w*h,u,p.get('title','')))
            if not cand: print('NO PHOTO',fn,q); continue
            cand.sort(reverse=True); _,url,title=cand[0]
            raw=requests.get(url,headers=headers,timeout=60).content
            im=Image.open(io.BytesIO(raw)).convert('RGB'); im=ImageOps.fit(im,(1200,900),method=Image.Resampling.LANCZOS,centering=(.5,.5)); im.save('assets-final/'+fn,'WEBP',quality=88,method=6)
            print(fn,'<-',title); time.sleep(.15)
          PY
          python /tmp/photos.py
      - name: Commit real photo assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets-final
          git diff --cached --quiet && exit 0
          git commit -m "Replace kiosk menu assets with real food photographs"
          git push
