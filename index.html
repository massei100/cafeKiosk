<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>키오스크 주문 연습</title><style>:root{--bg:#f7f2ec;--p:#6d4b3d;--p2:#4f342a;--soft:#efe2d6;--ink:#221e1b;--muted:#766b64;--sheet:none}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.hidden{display:none!important}.home{max-width:1100px;margin:auto;padding:34px 18px}.home h1{text-align:center;font-size:clamp(2rem,5vw,3.6rem);margin:0 0 8px}.home>p{text-align:center;color:var(--muted);font-weight:800}.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}.store{border:0;background:#fff;border-radius:28px;padding:0;overflow:hidden;box-shadow:0 12px 32px #3b2c2418;text-align:left}.storepic,.foodpic,.detailpic{background-image:var(--sheet);background-repeat:no-repeat;background-size:600% 600%;background-color:#f4eee8}.storepic{height:230px}.store .label{padding:18px 20px 22px}.store b{font-size:1.6rem}.store .desc{margin-top:6px;color:var(--muted);font-weight:750}.hero-cafe{background-position:0 0}.hero-burger{background-position:20% 0}.hero-bunsik{background-position:40% 0}.top{position:sticky;top:0;z-index:10;background:#fff;padding:10px 14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.back,.mode button,.small{border:0;border-radius:14px;padding:10px 13px;font-weight:900;background:var(--soft);color:var(--p)}.mode{display:flex;gap:8px}.mode button.on{background:var(--p);color:#fff}.app{max-width:1180px;margin:auto;padding:14px}.mission{background:#fff6d9;border:3px solid #f1c85d;border-radius:18px;padding:14px;margin-bottom:13px}.mission .title{font-weight:950;color:#8a5e14;margin-bottom:6px}.missionText{font-size:1.08rem;font-weight:900;line-height:1.5}.layout{display:grid;grid-template-columns:145px 1fr 310px;gap:14px;align-items:start}.panel{background:#fff;border-radius:22px;box-shadow:0 10px 28px #3b2c2414;overflow:hidden}.cats{padding:11px}.cat{width:100%;border:0;border-radius:15px;padding:13px 8px;margin-bottom:8px;background:var(--soft);color:var(--p);font-weight:950}.cat.on{background:var(--p);color:#fff}.menuarea{padding:14px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.head h2{margin:0}.head span{font-size:.9rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{border:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #2b211a15;text-align:left;padding:0}.foodpic{height:155px}.txt{padding:10px 12px 13px}.name{font-weight:950}.price{margin-top:5px;color:var(--p);font-weight:950}.cart{padding:14px;position:sticky;top:72px}.cart h2{margin:2px 0 12px}.empty{text-align:center;color:#998d86;padding:28px 8px}.cartrow{padding:10px;background:var(--soft);border-radius:13px;margin-bottom:8px}.cartline{display:flex;justify-content:space-between;gap:8px;font-weight:900}.cartopt{font-size:.76rem;color:var(--muted);margin-top:4px}.qty{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:7px}.qty button{width:30px;height:30px;border:0;border-radius:50%;background:#fff;font-weight:950}.total{display:flex;justify-content:space-between;border-top:2px dashed #ddd;margin-top:12px;padding-top:13px;font-size:1.18rem;font-weight:950}.pay{width:100%;border:0;border-radius:14px;padding:14px;margin-top:11px;background:var(--p);color:#fff;font-weight:950}.pay:disabled{opacity:.4}.overlay{position:fixed;inset:0;background:#1c1715a0;display:flex;align-items:center;justify-content:center;padding:15px;z-index:99}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px}.mh{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid #eee}.mh h3{margin:0}.x{border:0;width:38px;height:38px;border-radius:50%;background:#f1eeec;font-size:22px}.mb{padding:18px}.detailpic{height:210px;border-radius:18px;margin-bottom:16px}.group{margin-bottom:16px}.group b{display:block;margin-bottom:8px}.opts,.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt,.method{border:2px solid #e3d9d3;border-radius:14px;padding:13px 8px;background:#fff;font-weight:900}.opt.sel{border-color:var(--p);background:var(--soft);color:var(--p)}.add,.primary{width:100%;border:0;border-radius:14px;padding:14px;background:var(--p);color:#fff;font-weight:950}.method{padding:24px 8px}.cashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cashgrid button{border:0;border-radius:12px;padding:12px;background:var(--soft);color:var(--p);font-weight:950}.sumBox{background:#faf7f4;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.secondary{border:0;border-radius:14px;padding:14px;background:#eee;color:var(--p);font-weight:950}.receipt{width:min(360px,100%);margin:auto;border:1px solid #ccc;background:#fffdf9;padding:18px;font-family:ui-monospace,monospace}.receipt h2{text-align:center;margin:0}.receipt hr{border:0;border-top:1px dashed #999}.rl{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.order{text-align:center;font-size:2rem;font-weight:1000;color:var(--p)}.result{text-align:center;font-weight:950;margin-bottom:10px}.ok{color:#358b4c}.bad{color:#c44}.theme-cafe{--bg:#f7f2ec;--p:#6d4b3d;--p2:#4f342a;--soft:#efe2d6}.theme-burger{--bg:#fff7e5;--p:#d24c1f;--p2:#9f3214;--soft:#ffe0a0}.theme-bunsik{--bg:#fff3f1;--p:#cf343a;--p2:#98232a;--soft:#ffd7d1}@media(max-width:900px){.layout{grid-template-columns:105px 1fr}.cart{position:static;grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.home{padding:22px 11px}.stores{grid-template-columns:1fr;gap:13px}.storepic{height:180px}.brand span{display:none}.top{padding:8px}.app{padding:9px}.layout{display:block}.cats{display:flex;overflow:auto;gap:7px;margin-bottom:9px}.cat{min-width:88px;margin:0;padding:10px 8px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.foodpic{height:132px}.cart{margin-top:9px}.mode button{padding:8px 9px;font-size:.82rem}}</style></head><body><section id="home" class="home"><h1>어디에서 주문할까요?</h1><p>연습할 가게를 선택하세요.</p><div class="stores"><button class="store" onclick="enter('cafe')"><div class="storepic hero-cafe"></div><div class="label"><b>카페</b><div class="desc">커피 · 스무디 · 차 · 에이드 · 디저트</div></div></button><button class="store" onclick="enter('burger')"><div class="storepic hero-burger"></div><div class="label"><b>햄버거 가게</b><div class="desc">버거 · 세트 · 사이드 · 치킨 · 음료 · 디저트</div></div></button><button class="store" onclick="enter('bunsik')"><div class="storepic hero-bunsik"></div><div class="label"><b>분식집</b><div class="desc">떡볶이 · 김밥 · 튀김 · 면 · 식사 · 음료</div></div></button></div></section><section id="kiosk" class="hidden"><header class="top"><div class="brand"><button class="back" onclick="goHome()">← 가게 선택</button><span id="shop"></span></div><div class="mode"><button id="freeBtn" class="on" onclick="setMode(false)">자유 연습</button><button id="missionBtn" onclick="setMode(true)">미션 연습</button></div></header><main class="app"><section id="mission" class="mission hidden"><div class="title">오늘의 주문 미션</div><div id="missionText" class="missionText"></div><div style="display:flex;gap:8px;margin-top:9px"><button class="small" onclick="newMission()">새 미션</button><button class="small" onclick="speak(document.getElementById('missionText').textContent)">다시 듣기</button></div></section><div class="layout"><aside class="panel cats" id="cats"></aside><section class="panel menuarea"><div class="head"><h2 id="ct"></h2><span>메뉴를 눌러 주문하세요.</span></div><div id="grid" class="grid"></div></section><aside class="panel cart"><h2>장바구니</h2><div id="cart"></div><div class="total"><span>총 금액</span><span id="sum">0원</span></div><button id="pay" class="pay" disabled onclick="payment()">결제하기</button></aside></div></main></section><div id="pop"></div><script>const D={cafe:{n:'카페',off:3,c:{'커피':[['아메리카노',4000,1,1],['카페라떼',4500,1,1],['바닐라라떼',5000,1,1],['카라멜마키아토',5200,1,1],['카페모카',5000,1,1],['아인슈페너',5500,0,1]],'스무디':[['딸기 스무디',5500,0,1],['망고 스무디',5500,0,1],['블루베리 스무디',5800,0,1],['요거트 스무디',5200,0,1]],'차':[['녹차라떼',4500,1,1],['초코라떼',4500,1,1],['레몬차',4200,1,1],['자몽차',4500,1,1]],'에이드':[['레몬에이드',4800,0,1],['청포도에이드',5000,0,1],['자몽에이드',5000,0,1]],'디저트':[['딸기케이크',5500,0,0],['초코케이크',5800,0,0],['크루아상',3800,0,0],['초코쿠키',2500,0,0]]}},burger:{n:'햄버거 가게',off:14,c:{'버거':[['불고기버거',4800,0,0],['치즈버거',5000,0,0],['더블치즈버거',6500,0,0],['베이컨버거',6200,0,0],['치킨버거',5500,0,0],['새우버거',5600,0,0]],'세트':[['불고기버거 세트',7800,0,0],['치즈버거 세트',8000,0,0],['치킨버거 세트',8500,0,0],['새우버거 세트',8600,0,0]],'사이드':[['감자튀김',2500,0,1],['어니언링',3000,0,0],['치즈스틱',2800,0,0],['치킨너겟',3200,0,0]],'치킨':[['치킨윙',4500,0,0],['치킨텐더',4800,0,0]],'음료':[['콜라',2200,0,1],['사이다',2200,0,1],['오렌지주스',2800,0,1]],'디저트':[['소프트아이스크림',1800,0,0],['초코선데이',2500,0,0]]}},bunsik:{n:'분식집',off:25,c:{'떡볶이':[['떡볶이',4000,0,0],['치즈떡볶이',5000,0,0],['로제떡볶이',5500,0,0],['라볶이',5000,0,0]],'김밥':[['김밥',3000,0,0],['참치김밥',4000,0,0],['치즈김밥',3800,0,0],['돈가스김밥',4500,0,0]],'튀김':[['모둠튀김',4500,0,0],['김말이',3000,0,0],['오징어튀김',3500,0,0],['야채튀김',3000,0,0]],'면':[['라면',4000,0,0],['쫄면',5000,0,0],['우동',5000,0,0]],'식사':[['돈가스',7500,0,0],['김치볶음밥',6500,0,0],['오므라이스',7000,0,0]],'음료':[['콜라',2000,0,1],['사이다',2000,0,1],['생수',1000,0,0]]}}};let S=null,cat='',basket=[],missionOn=false,mission=null,optTemp='ICE',optSize='보통',paid=0;const $=id=>document.getElementById(id),won=n=>n.toLocaleString('ko-KR')+'원';async function loadSheet(){try{let r=await fetch('./assets/menu-sheet-v3-small.b64?v=5',{cache:'no-store'});let t=(await r.text()).trim();document.documentElement.style.setProperty('--sheet',`url("data:image/jpeg;base64,${t}")`)}catch(e){console.error('image load failed',e)}}loadSheet();function enter(s){S=s;document.body.className='theme-'+s;$('home').classList.add('hidden');$('kiosk').classList.remove('hidden');$('shop').textContent=D[s].n+' 키오스크';basket=[];missionOn=false;$('mission').classList.add('hidden');$('freeBtn').classList.add('on');$('missionBtn').classList.remove('on');renderCats();renderCart()}function goHome(){$('kiosk').classList.add('hidden');$('home').classList.remove('hidden');document.body.className=''}function renderCats(){let ks=Object.keys(D[S].c);cat=ks[0];$('cats').innerHTML=ks.map((x,i)=>`<button class="cat ${i?'':'on'}" onclick="choose('${x}',this)">${x}</button>`).join('');renderGrid()}function choose(x,b){cat=x;document.querySelectorAll('.cat').forEach(e=>e.classList.remove('on'));b.classList.add('on');renderGrid()}function posFor(idx){let k=idx,r=Math.floor(k/6),c=k%6;return `${c*20}% ${r*20}%`}function renderGrid(){let all=Object.values(D[S].c).flat(),base=all.indexOf(D[S].c[cat][0]);$('ct').textContent=cat;$('grid').innerHTML=D[S].c[cat].map((x,i)=>{let idx=D[S].off+((base+i)%11);return `<button class="item" onclick="openItem('${x[0]}',${x[1]},${x[2]},${x[3]},${idx})"><div class="foodpic" style="background-position:${posFor(idx)}"></div><div class="txt"><div class="name">${x[0]}</div><div class="price">${won(x[1])}${x[3]?'~':''}</div></div></button>`}).join('')}function openItem(n,p,temp,size,idx){optTemp=temp?'ICE':'없음';optSize=size?'보통':'없음';$('pop').innerHTML=`<div class="overlay"><div class="modal"><div class="mh"><h3>${n}</h3><button class="x" onclick="closePop()">×</button></div><div class="mb"><div class="detailpic" style="background-position:${posFor(idx)}"></div>${temp?`<div class="group"><b>온도를 선택하세요</b><div class="opts"><button id="hot" class="opt" onclick="pickTemp('HOT')">HOT</button><button id="ice" class="opt sel" onclick="pickTemp('ICE')">ICE</button></div></div>`:''}${size?`<div class="group"><b>크기를 선택하세요</b><div class="opts"><button id="normal" class="opt sel" onclick="pickSize('보통')">보통</button><button id="large" class="opt" onclick="pickSize('큰 사이즈')">큰 사이즈 +500원</button></div></div>`:''}<button class="add" onclick="addCart('${n}',${p})">장바구니에 담기</button></div></div></div>`}function pickTemp(v){optTemp=v;['hot','ice'].forEach(i=>$(i)?.classList.remove('sel'));$(v==='HOT'?'hot':'ice')?.classList.add('sel')}function pickSize(v){optSize=v;['normal','large'].forEach(i=>$(i)?.classList.remove('sel'));$(v==='보통'?'normal':'large')?.classList.add('sel')}function closePop(){$('pop').innerHTML=''}function addCart(n,p){let fp=p+(optSize==='큰 사이즈'?500:0),key=n+'|'+optTemp+'|'+optSize,z=basket.find(x=>x.key===key);z?z.q++:basket.push({key,n,p:fp,temp:optTemp,size:optSize,q:1});closePop();renderCart()}function renderCart(){let t=basket.reduce((a,x)=>a+x.p*x.q,0);$('cart').innerHTML=basket.length?basket.map((x,i)=>`<div class="cartrow"><div class="cartline"><span>${x.n}</span><span>${won(x.p*x.q)}</span></div><div class="cartopt">${[x.temp!=='없음'?x.temp:'',x.size!=='없음'?x.size:''].filter(Boolean).join(' · ')}</div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${x.q}</b><button onclick="qty(${i},1)">+</button></div></div>`).join(''):'<div class="empty">메뉴를 선택해 주세요.</div>';$('sum').textContent=won(t);$('pay').disabled=!basket.length}function qty(i,d){basket[i].q+=d;if(basket[i].q<=0)basket.splice(i,1);renderCart()}function setMode(v){missionOn=v;$('freeBtn').classList.toggle('on',!v);$('missionBtn').classList.toggle('on',v);$('mission').classList.toggle('hidden',!v);basket=[];renderCart();if(v)newMission()}function newMission(){let all=Object.values(D[S].c).flat(),count=Math.random()<.6?1:2,picks=[];while(picks.length<count){let x=all[Math.floor(Math.random()*all.length)];if(!picks.some(y=>y[0]===x[0]))picks.push(x)}let pay=Math.random()<.5?'카드':'현금';mission={items:picks.map(x=>x[0]),pay};$('missionText').textContent=picks.map(x=>x[0]+' 1개').join(' + ')+`를 주문하고 ${pay}으로 결제하세요.`}function payment(){$('pop').innerHTML=`<div class="overlay"><div class="modal"><div class="mh"><h3>결제 방법을 선택하세요</h3><button class="x" onclick="closePop()">×</button></div><div class="mb"><div class="methods"><button class="method" onclick="cardPay()">카드 결제</button><button class="method" onclick="cashPay()">현금 결제</button></div><div class="sumBox"><b>결제할 금액</b><br><span style="font-size:1.4rem;font-weight:950">${won(total())}</span></div></div></div></div>`}function total(){return basket.reduce((a,x)=>a+x.p*x.q,0)}function cardPay(){$('pop').innerHTML=`<div class="overlay"><div class="modal"><div class="mh"><h3>카드 결제</h3><button class="x" onclick="closePop()">×</button></div><div class="mb"><div style="height:170px;display:grid;place-items:center"><div style="width:180px;height:110px;border-radius:15px;background:linear-gradient(135deg,#1e3854,#55758f);box-shadow:0 14px 28px #0002;transform:rotate(-7deg);position:relative"><div style="width:30px;height:23px;border-radius:5px;background:#dfc66a;position:absolute;left:22px;top:42px"></div><b style="position:absolute;left:22px;bottom:18px;color:#fff;letter-spacing:2px">CARD</b></div></div><button class="primary" onclick="done('카드',${total()})">카드 결제 완료</button></div></div></div>`}function cashPay(){paid=0;$('pop').innerHTML=`<div class="overlay"><div class="modal"><div class="mh"><h3>현금 결제</h3><button class="x" onclick="closePop()">×</button></div><div class="mb"><b>돈을 눌러 금액을 맞춰보세요.</b><div class="cashgrid" style="margin-top:10px">${[100,500,1000,5000,10000,50000].map(v=>`<button onclick="addMoney(${v})">${won(v)}</button>`).join('')}</div><div class="sumBox"><div>상품 금액: <b>${won(total())}</b></div><div>낸 금액: <b id="paid">0원</b></div><div>거스름돈: <b id="change">0원</b></div></div><div class="actions"><button class="secondary" onclick="paid=0;updateMoney()">다시 내기</button><button class="primary" onclick="finishCash()">결제하기</button></div></div></div></div>`}function addMoney(v){paid+=v;updateMoney()}function updateMoney(){$('paid').textContent=won(paid);$('change').textContent=won(Math.max(0,paid-total()))}function finishCash(){if(paid<total())return alert('금액이 부족해요.');done('현금',paid)}function done(method,amt){let ok=true;if(missionOn&&mission){let actual=[];basket.forEach(x=>{for(let i=0;i<x.q;i++)actual.push(x.n)});ok=mission.pay===method&&mission.items.length===actual.length&&mission.items.every(n=>actual.includes(n))}let no=Math.floor(1000+Math.random()*9000);$('pop').innerHTML=`<div class="overlay"><div class="modal"><div class="mh"><h3>주문 완료</h3><button class="x" onclick="finish()">×</button></div><div class="mb">${missionOn?`<div class="result ${ok?'ok':'bad'}">${ok?'미션 성공! 정확하게 주문했어요.':'미션을 다시 확인해 보세요.'}</div>`:''}<div class="receipt"><h2>${D[S].n}</h2><div style="text-align:center">키오스크 주문 연습</div><hr>${basket.map(x=>`<div class="rl"><span>${x.n} × ${x.q}</span><span>${won(x.p*x.q)}</span></div>`).join('')}<hr><div class="rl"><b>합계</b><b>${won(total())}</b></div><div class="rl"><span>결제</span><span>${method}</span></div>${method==='현금'?`<div class="rl"><span>받은 금액</span><span>${won(amt)}</span></div><div class="rl"><span>거스름돈</span><span>${won(amt-total())}</span></div>`:''}<hr><div class="order">${no}</div></div><button class="primary" style="margin-top:13px" onclick="finish()">처음으로</button></div></div></div>`}function finish(){closePop();basket=[];renderCart();if(missionOn)newMission()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}</script></body></html>
