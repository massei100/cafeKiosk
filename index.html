<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2ed"><title>키오스크 주문 연습</title><link rel="stylesheet" href="final.css?v=1"></head><body>
<section id="home" class="home"><h1>어디에서 주문할까요?</h1><p>연습할 가게를 선택하세요.</p><div id="stores" class="store-grid"></div></section>
<section id="app" class="hidden"><header class="top"><div class="topin"><button class="btn" onclick="goHome()">← 가게 선택</button><div id="brand" class="brand"></div><div class="modebox"><button id="freeBtn" class="btn on" onclick="setMode('free')">자유 연습</button><button id="missionBtn" class="btn" onclick="setMode('mission')">미션 연습</button></div></div></header><main class="main"><div class="practice"><div class="practice-card"><b>어디에서 드시나요?</b><div class="seg"><button id="dine" class="on" onclick="setOrderType('매장')">매장</button><button id="take" onclick="setOrderType('포장')">포장</button></div></div><div class="practice-card"><b>현재 연습</b><span id="modeText" class="guide">자유롭게 주문해 보세요.</span></div></div><section id="missionBox" class="mission hidden"><b>오늘의 주문 미션</b><div id="missionText" class="mission-text"></div><div class="mission-actions"><button onclick="newMission()">새 미션</button><button onclick="speakMission()">다시 듣기</button></div></section><div class="layout"><aside class="panel cats"><div id="catlist" class="cat-list"></div></aside><section class="panel menu"><div class="menu-head"><h2 id="catTitle"></h2><span>메뉴를 눌러 주문하세요.</span></div><div id="grid" class="grid"></div></section><aside class="panel cart"><h2>장바구니</h2><div id="cartBox"></div><div class="total"><span>총 금액</span><span id="total">0원</span></div><button id="pay" class="pay" disabled onclick="openPayment()">결제하기</button></aside></div></main></section><div id="modal"></div>
<script src="final.js?v=1"></script></body></html>
