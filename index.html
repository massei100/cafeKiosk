<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>키오스크 주문 연습</title>
<meta name="theme-color" content="#5d4037">
<style>
:root{--bg:#f7f2ec;--panel:#fff;--primary:#5d4037;--primary2:#7a5a50;--soft:#efe3d5;--accent:#66a06f;--text:#272321;--muted:#766d68;--shadow:0 8px 24px rgba(40,30,25,.12)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #eee;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:25px}.mode-switch{display:flex;gap:8px}.mode-switch button,.smallbtn{border:0;border-radius:14px;padding:10px 14px;font-weight:900;background:var(--soft);color:var(--primary)}.mode-switch button.active{background:var(--primary);color:#fff}.homeBtn{border:0;background:#f2f2f2;border-radius:13px;padding:10px 12px;font-weight:900}.app{max-width:1180px;margin:auto;padding:16px}.hero{text-align:center;padding:34px 16px 20px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 10px}.hero p{margin:0;color:var(--muted);font-weight:750;font-size:1.1rem}.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1000px;margin:24px auto}.store-card{border:0;border-radius:28px;padding:26px 20px;background:#fff;box-shadow:var(--shadow);text-align:center;min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center}.store-card .store-icon{font-size:78px;margin-bottom:10px}.store-card h2{margin:4px 0;font-size:1.6rem}.store-card p{margin:8px 0 0;color:var(--muted);font-weight:700;line-height:1.45}.store-card.cafe{background:linear-gradient(160deg,#fffaf5,#ead9cb)}.store-card.burger{background:linear-gradient(160deg,#fff8e5,#ffe39b)}.store-card.bunsik{background:linear-gradient(160deg,#fff4f3,#ffd2ca)}.mission-box{display:none;background:#fff8e8;border:3px solid #f4c968;border-radius:20px;padding:15px 17px;margin-bottom:14px;box-shadow:var(--shadow)}.mission-box.show{display:block}.mission-title{font-weight:950;color:#845712;margin-bottom:6px}.mission-text{font-size:1.14rem;font-weight:900;line-height:1.55}.mission-actions{margin-top:10px;display:flex;gap:8px}.layout{display:grid;grid-template-columns:150px 1fr 310px;gap:14px;align-items:start}.panel{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.categories{padding:11px}.cat-btn{width:100%;border:0;background:var(--soft);color:var(--primary);border-radius:16px;padding:14px 8px;margin-bottom:9px;font-weight:950;display:flex;flex-direction:column;gap:5px;align-items:center}.cat-btn .ico{font-size:29px}.cat-btn.active{background:var(--primary);color:#fff}.content{padding:15px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:2px 2px 13px}.section-title h2{margin:0}.section-title span{font-size:.9rem;color:var(--muted)}.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.menu-card{border:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 15px rgba(30,20,15,.09);text-align:left}.menu-visual{aspect-ratio:1.18/1;display:grid;place-items:center;background:linear-gradient(155deg,#fff,var(--soft));position:relative}.menu-visual .food{font-size:63px;filter:drop-shadow(0 7px 7px rgba(0,0,0,.12))}.tag{position:absolute;right:8px;top:8px;background:#fff;border-radius:99px;padding:5px 8px;font-size:.7rem;font-weight:900;color:var(--primary)}.menu-info{padding:11px 12px 13px}.menu-name{font-size:1rem;font-weight:950}.menu-desc{min-height:2.2em;margin-top:4px;font-size:.76rem;color:var(--muted)}.price{margin-top:7px;font-weight:950;color:var(--primary)}.cart{padding:14px;position:sticky;top:74px}.cart h3{margin:2px 0 11px}.cart-list{display:flex;flex-direction:column;gap:8px;max-height:390px;overflow:auto}.empty{text-align:center;color:#9a8d86;padding:25px 8px}.cart-item{background:var(--soft);border-radius:14px;padding:10px}.cart-line{display:flex;justify-content:space-between;gap:7px;font-weight:900}.cart-opt{font-size:.76rem;color:var(--muted);margin-top:4px}.cart-controls{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-top:6px}.circle{border:0;width:30px;height:30px;border-radius:50%;background:#fff;font-weight:950}.total{display:flex;justify-content:space-between;border-top:2px dashed #ddd;margin-top:13px;padding-top:13px;font-size:1.18rem;font-weight:950}.checkout{width:100%;border:0;background:var(--primary);color:#fff;border-radius:15px;padding:14px;margin-top:11px;font-weight:950;font-size:1.04rem}.checkout:disabled{opacity:.4}.overlay{position:fixed;inset:0;background:rgba(25,20,18,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.overlay.show{display:flex}.modal{background:#fff;border-radius:25px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal-head{padding:17px 19px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.close{border:0;background:#f2efed;border-radius:50%;width:36px;height:36px;font-size:20px}.modal-body{padding:18px}.opt-group{margin-bottom:17px}.label{font-weight:950;margin-bottom:8px}.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opt-btn{border:2px solid #e3dcd8;background:#fff;border-radius:13px;padding:12px 8px;font-weight:900}.opt-btn.selected{border-color:var(--primary);background:var(--soft);color:var(--primary)}.add-btn,.primary{border:0;background:var(--primary);color:#fff;border-radius:14px;padding:14px;font-weight:950}.add-btn{width:100%}.secondary{border:0;background:#eee;color:var(--primary);border-radius:14px;padding:14px;font-weight:950}.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-card{border:2px solid #e4ddd9;background:#fff;border-radius:18px;padding:20px 8px;font-size:1.05rem;font-weight:950}.money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.money{border:0;background:var(--soft);color:var(--primary);border-radius:12px;padding:12px 6px;font-weight:950}.money-summary{background:#faf7f4;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7}.final-actions{display:flex;gap:8px;margin-top:13px}.final-actions>*{flex:1}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#262321;color:#fff;padding:12px 18px;border-radius:99px;font-weight:900;opacity:0;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.receipt{width:min(360px,100%);margin:auto;border:1px solid #d7d2cf;background:#fffdf9;padding:18px;font-family:ui-monospace,monospace}.receipt h2{text-align:center;margin:0 0 3px;font-family:system-ui}.center{text-align:center}.receipt hr{border:0;border-top:1px dashed #999;margin:12px 0}.rline{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.order-no{text-align:center;font-size:2rem;font-weight:1000;color:var(--primary);margin:6px}.success,.fail{text-align:center;font-weight:950;margin:9px 0}.success{color:#3c8a52}.fail{color:#c44}.theme-cafe{--bg:#f7f2ec;--primary:#65473d;--soft:#efe3d5}.theme-burger{--bg:#fff8e8;--primary:#d94b20;--soft:#ffe1a8}.theme-bunsik{--bg:#fff5f4;--primary:#c93538;--soft:#ffd8d2}
@media(max-width:900px){.layout{grid-template-columns:110px 1fr}.cart{position:static;grid-column:1/-1}.menu-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.stores{grid-template-columns:1fr;gap:13px}.store-card{min-height:175px;padding:18px}.store-card .store-icon{font-size:58px}.topbar{padding:9px}.brand span{display:none}.app{padding:9px}.layout{display:block}.categories{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.cat-btn{min-width:86px;margin:0;padding:9px 7px}.cat-btn .ico{font-size:23px}.menu-grid{grid-template-columns:repeat(2,1fr);gap:9px}.menu-visual .food{font-size:48px}.menu-info{padding:9px}.menu-desc{display:none}.cart{margin-top:9px}.mode-switch button{padding:8px 9px;font-size:.82rem}}
</style></head>
<body>
<section id="storeSelect"><div class="hero"><h1>무엇을 주문해 볼까요?</h1><p>연습할 가게를 선택하세요.</p></div><div class="stores"><button class="store-card cafe" onclick="enterStore('cafe')"><div class="store-icon">☕</div><h2>카페</h2><p>커피 · 스무디 · 차 · 에이드 · 디저트</p></button><button class="store-card burger" onclick="enterStore('burger')"><div class="store-icon">🍔</div><h2>햄버거 가게</h2><p>버거 · 세트 · 사이드 · 음료 · 디저트</p></button><button class="store-card bunsik" onclick="enterStore('bunsik')"><div class="store-icon">🍢</div><h2>분식집</h2><p>떡볶이 · 김밥 · 튀김 · 면 · 음료</p></button></div></section>
<section id="kiosk" class="hidden"><header class="topbar"><div class="brand"><button class="homeBtn" onclick="goHome()">← 가게 선택</button><div class="logo" id="storeLogo">☕</div><span id="storeTitle">카페 키오스크</span></div><div class="mode-switch"><button id="practiceBtn" class="active">자유 연습</button><button id="missionBtn">미션 연습</button></div></header><main class="app"><section id="missionBox" class="mission-box"><div class="mission-title">🎯 오늘의 주문 미션</div><div id="missionText" class="mission-text"></div><div class="mission-actions"><button class="smallbtn" id="newMission">새 미션</button><button class="smallbtn" id="hearMission">🔊 다시 듣기</button></div></section><div class="layout"><aside class="panel categories" id="categories"></aside><section class="panel content"><div class="section-title"><h2 id="catTitle"></h2><span>메뉴를 눌러 주문하세요.</span></div><div class="menu-grid" id="menuGrid"></div></section><aside class="panel cart"><h3>🛒 장바구니</h3><div class="cart-list" id="cartList"></div><div class="total"><span>총 금액</span><span id="total">0원</span></div><button id="checkout" class="checkout" disabled>결제하기</button></aside></div></main></section>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const stores={cafe:{name:'카페',logo:'☕',theme:'theme-cafe',cats:{'커피':['☕',[['americano','아메리카노',3000,'☕',1,1],['latte','카페라떼',3800,'🥛',1,1],['vanilla','바닐라라떼',4300,'🍮',1,1],['mocha','카페모카',4500,'🍫',1,1]]],'스무디':['🥤',[['strawberry','딸기 스무디',5000,'🍓',0,1],['mango','망고 스무디',5200,'🥭',0,1],['yogurt','요거트 스무디',4800,'🥤',0,1]]],'차':['🍵',[['lemontea','레몬차',3800,'🍋',1,1],['greentea','녹차',3500,'🍵',1,1],['peach','복숭아 아이스티',3500,'🍑',0,1]]],'에이드':['🫧',[['lemonade','레몬 에이드',4500,'🍋',0,1],['grapeade','청포도 에이드',4700,'🍇',0,1]]],'디저트':['🍰',[['cake','초코 케이크',5500,'🍰',0,0],['croissant','크루아상',3800,'🥐',0,0],['cookie','초코칩 쿠키',2500,'🍪',0,0]]] }},burger:{name:'햄버거 가게',logo:'🍔',theme:'theme-burger',cats:{'버거':['🍔',[['bulgogi','불고기버거',4900,'🍔',0,0],['cheese','치즈버거',5200,'🧀',0,0],['chicken','치킨버거',5500,'🍗',0,0],['shrimp','새우버거',5700,'🍤',0,0]]],'세트':['🍟',[['bulgogiset','불고기버거 세트',7900,'🍔',0,0],['cheeseset','치즈버거 세트',8200,'🧀',0,0],['chickenset','치킨버거 세트',8500,'🍗',0,0]]],'사이드':['🍟',[['fries','감자튀김',2500,'🍟',0,1],['nugget','치킨너겟',3500,'🍗',0,0],['onion','어니언링',3200,'🧅',0,0]]],'음료':['🥤',[['cola','콜라',2200,'🥤',0,1],['cider','사이다',2200,'🥤',0,1],['juice','오렌지주스',2800,'🍊',0,1]]],'디저트':['🍦',[['icecream','아이스크림',1800,'🍦',0,0],['sundae','초코 선데이',2500,'🍨',0,0]]] }},bunsik:{name:'분식집',logo:'🍢',theme:'theme-bunsik',cats:{'떡볶이':['🌶️',[['tteok','떡볶이',4000,'🌶️',0,0],['cheesetteok','치즈 떡볶이',5000,'🧀',0,0],['rosé','로제 떡볶이',5500,'🍲',0,0]]],'김밥':['🍙',[['basicgimbap','야채김밥',3000,'🍙',0,0],['tunagimbap','참치김밥',4000,'🐟',0,0],['cheesegimbap','치즈김밥',3800,'🧀',0,0]]],'튀김':['🍤',[['twigim','모둠튀김',4000,'🍤',0,0],['dumpling','튀김만두',3000,'🥟',0,0],['sweetpotato','고구마튀김',3000,'🍠',0,0]]],'면':['🍜',[['ramen','라면',4000,'🍜',0,0],['udon','우동',4500,'🍜',0,0],['jjolmyeon','쫄면',5000,'🥢',0,0]]],'음료':['🥤',[['cola2','콜라',2000,'🥤',0,1],['cider2','사이다',2000,'🥤',0,1],['water','생수',1000,'💧',0,0]]] }}};
let storeKey=null,currentCat='',cart=[],mode='practice',mission=null,tempChoice='ICE',sizeChoice='보통',paid=0;const $=s=>document.querySelector(s),won=n=>n.toLocaleString('ko-KR')+'원';
function normalizedItems(){let a=[];for(const[c,[ico,items]]of Object.entries(stores[storeKey].cats)){for(const x of items)a.push({id:x[0],name:x[1],price:x[2],icon:x[3],temp:!!x[4],size:!!x[5],cat:c})}return a}function item(id){return normalizedItems().find(x=>x.id===id)}
function enterStore(k){storeKey=k;document.body.className=stores[k].theme;$('#storeSelect').classList.add('hidden');$('#kiosk').classList.remove('hidden');$('#storeLogo').textContent=stores[k].logo;$('#storeTitle').textContent=stores[k].name+' 키오스크';currentCat=Object.keys(stores[k].cats)[0];cart=[];mode='practice';$('#practiceBtn').classList.add('active');$('#missionBtn').classList.remove('active');$('#missionBox').classList.remove('show');renderAll()}function goHome(){closeModal();$('#kiosk').classList.add('hidden');$('#storeSelect').classList.remove('hidden');document.body.className=''}function renderAll(){renderCats();renderMenu();renderCart()}
function renderCats(){$('#categories').innerHTML=Object.entries(stores[storeKey].cats).map(([c,[ico]])=>`<button class="cat-btn ${c===currentCat?'active':''}" onclick="setCat('${c}')"><span class="ico">${ico}</span>${c}</button>`).join('')}function setCat(c){currentCat=c;renderCats();renderMenu()}function renderMenu(){const [ico,items]=stores[storeKey].cats[currentCat];$('#catTitle').textContent=currentCat;$('#menuGrid').innerHTML=items.map(x=>`<button class="menu-card" onclick="openItem('${x[0]}')"><div class="menu-visual"><span class="food">${x[3]}</span><span class="tag">${currentCat}</span></div><div class="menu-info"><div class="menu-name">${x[1]}</div><div class="menu-desc">${x[1]} 주문 연습</div><div class="price">${won(x[2])}${x[5]?'~':''}</div></div></button>`).join('')}
function openItem(id){const x=item(id);tempChoice=x.temp?'ICE':'없음';sizeChoice=x.size?'보통':'없음';$('#modal').innerHTML=`<div class="modal-head"><h3>${x.icon} ${x.name}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${x.temp?`<div class="opt-group"><div class="label">온도를 선택하세요</div><div class="opt-grid"><button class="opt-btn" id="hot" onclick="chooseTemp('HOT')">🔥 HOT</button><button class="opt-btn selected" id="ice" onclick="chooseTemp('ICE')">🧊 ICE</button></div></div>`:''}${x.size?`<div class="opt-group"><div class="label">크기를 선택하세요</div><div class="opt-grid"><button class="opt-btn selected" id="normal" onclick="chooseSize('보통')">보통</button><button class="opt-btn" id="large" onclick="chooseSize('큰 사이즈')">큰 사이즈 +500원</button></div></div>`:''}<button class="add-btn" onclick="addToCart('${id}')">장바구니에 담기</button></div>`;$('#overlay').classList.add('show')}
function chooseTemp(v){tempChoice=v;['hot','ice'].forEach(x=>$('#'+x)?.classList.remove('selected'));$('#'+(v==='HOT'?'hot':'ice'))?.classList.add('selected')}function chooseSize(v){sizeChoice=v;['normal','large'].forEach(x=>$('#'+x)?.classList.remove('selected'));$('#'+(v==='보통'?'normal':'large'))?.classList.add('selected')}function closeModal(){$('#overlay').classList.remove('show')}
function addToCart(id){const x=item(id),price=x.price+(sizeChoice==='큰 사이즈'?500:0),key=[id,tempChoice,sizeChoice].join('|'),old=cart.find(i=>i.key===key);if(old)old.qty++;else cart.push({...x,key,temp:tempChoice,size:sizeChoice,finalPrice:price,qty:1});closeModal();renderCart();toast('장바구니에 담았어요.')}
function renderCart(){const b=$('#cartList');b.innerHTML=!cart.length?'<div class="empty">메뉴를 선택해 주세요.</div>':cart.map((i,n)=>`<div class="cart-item"><div class="cart-line"><span>${i.icon} ${i.name}</span><span>${won(i.finalPrice*i.qty)}</span></div><div class="cart-opt">${[i.temp!=='없음'?i.temp:'',i.size!=='없음'?i.size:''].filter(Boolean).join(' · ')}</div><div class="cart-controls"><button class="circle" onclick="qty(${n},-1)">−</button><b>${i.qty}</b><button class="circle" onclick="qty(${n},1)">＋</button></div></div>`).join('');$('#total').textContent=won(total());$('#checkout').disabled=!cart.length}function qty(n,d){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);renderCart()}function total(){return cart.reduce((s,i)=>s+i.finalPrice*i.qty,0)}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function checkout(){$('#modal').innerHTML=`<div class="modal-head"><h3>결제 방법을 선택하세요</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="pay-methods"><button class="pay-card" onclick="cardPay()">💳<br>카드 결제</button><button class="pay-card" onclick="cashPay()">💵<br>현금 결제</button></div><div class="money-summary"><b>결제할 금액</b><br><span style="font-size:1.45rem;font-weight:950">${won(total())}</span></div></div>`;$('#overlay').classList.add('show')}function cardPay(){$('#modal').innerHTML=`<div class="modal-head"><h3>💳 카드 결제</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div style="font-size:5rem;text-align:center">💳</div><button class="primary" style="width:100%;margin-top:12px" onclick="finishPay('card',${total()})">카드 결제 완료</button></div>`}
function cashPay(){paid=0;$('#modal').innerHTML=`<div class="modal-head"><h3>💵 현금 결제</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="label">돈을 눌러 금액을 맞춰보세요.</div><div class="money-grid">${[100,500,1000,5000,10000,50000].map(v=>`<button class="money" onclick="addMoney(${v})">${won(v)}</button>`).join('')}</div><div class="money-summary"><div>상품 금액: <b>${won(total())}</b></div><div>낸 금액: <b id="paid">0원</b></div><div>거스름돈: <b id="change">0원</b></div></div><div class="final-actions"><button class="secondary" onclick="paid=0;updateMoney()">다시 내기</button><button class="primary" onclick="finishCash()">결제하기</button></div></div>`}function addMoney(v){paid+=v;updateMoney()}function updateMoney(){$('#paid').textContent=won(paid);$('#change').textContent=won(Math.max(0,paid-total()))}function finishCash(){if(paid<total()){toast('금액이 부족해요.');return}finishPay('cash',paid)}
function finishPay(method,paidAmount){const order=Math.floor(100+Math.random()*900),result=mode==='mission'?checkMission(method):'',rows=cart.map(i=>`<div class="rline"><span>${i.name} x${i.qty}</span><span>${won(i.finalPrice*i.qty)}</span></div>`).join(''),change=method==='cash'?paidAmount-total():0;$('#modal').innerHTML=`<div class="modal-head"><h3>주문 완료</h3><button class="close" onclick="resetOrder()">×</button></div><div class="modal-body">${result}<div class="receipt"><h2>${stores[storeKey].name}</h2><div class="center">키오스크 주문 연습</div><hr><div class="center">주문번호</div><div class="order-no">${order}</div><hr>${rows}<hr><div class="rline"><b>합계</b><b>${won(total())}</b></div><div class="rline"><span>결제</span><span>${method==='cash'?'현금':'카드'}</span></div>${method==='cash'?`<div class="rline"><span>받은 금액</span><span>${won(paidAmount)}</span></div><div class="rline"><span>거스름돈</span><span>${won(change)}</span></div>`:''}<hr><div class="center">주문이 완료되었습니다.</div></div><button class="primary" style="width:100%;margin-top:13px" onclick="resetOrder()">처음으로</button></div>`}
function resetOrder(){closeModal();cart=[];renderCart();if(mode==='mission')makeMission()}function makeMission(){const all=normalizedItems(),count=Math.random()<.6?1:2,picks=[];while(picks.length<count){const x=all[Math.floor(Math.random()*all.length)];if(!picks.find(p=>p.id===x.id))picks.push(x)}const its=picks.map(x=>({id:x.id,name:x.name,temp:x.temp?(Math.random()<.5?'ICE':'HOT'):'없음',size:x.size?(Math.random()<.7?'보통':'큰 사이즈'):'없음'})),method=Math.random()<.5?'card':'cash';mission={items:its,method};$('#missionText').textContent=its.map(i=>`${i.temp!=='없음'?i.temp+' ':''}${i.name}${i.size==='큰 사이즈'?' 큰 사이즈':''}`).join(' + ')+`를 주문하고 ${method==='cash'?'현금':'카드'}으로 결제하세요.`;cart=[];renderCart()}
function checkMission(method){const d=[...mission.items].sort((a,b)=>a.id.localeCompare(b.id)),a=[];cart.forEach(i=>{for(let q=0;q<i.qty;q++)a.push({id:i.id,temp:i.temp,size:i.size})});a.sort((x,y)=>x.id.localeCompare(y.id));const itemsOk=d.length===a.length&&d.every((x,n)=>x.id===a[n].id&&x.temp===a[n].temp&&x.size===a[n].size),payOk=method===mission.method;if(itemsOk&&payOk){speak('미션 성공! 아주 잘했어요.');return'<div class="success">🎉 미션 성공! 정확하게 주문했어요.</div>'}speak('미션을 다시 확인해 보세요.');return'<div class="fail">🔎 미션을 다시 확인해 보세요.</div>'}
function setMode(m){mode=m;$('#practiceBtn').classList.toggle('active',m==='practice');$('#missionBtn').classList.toggle('active',m==='mission');$('#missionBox').classList.toggle('show',m==='mission');cart=[];renderCart();if(m==='mission')makeMission()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}
$('#practiceBtn').onclick=()=>setMode('practice');$('#missionBtn').onclick=()=>setMode('mission');$('#newMission').onclick=makeMission;$('#hearMission').onclick=()=>speak($('#missionText').textContent);$('#checkout').onclick=checkout;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
</script></body></html>
