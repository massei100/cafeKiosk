<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>키오스크 주문 연습</title><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;margin:0;background:#f7f2ec;color:#222}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{text-align:center}.hero h1{font-size:48px;margin:10px}.hero p{font-weight:700;color:#765}.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}.store{border:0;background:white;border-radius:24px;padding:0;overflow:hidden;box-shadow:0 8px 24px #0002;text-align:left}.pic{height:230px;background-image:url('assets/menu-sheet.jpg');background-size:300% 300%;background-repeat:no-repeat}.cafe{background-position:0 0}.burger{background-position:50% 0}.bunsik{background-position:100% 0}.label{padding:18px}.label b{font-size:27px}.label div{margin-top:6px;color:#765;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 18px;position:sticky;top:0;z-index:5}.top button,.cat,.mode{border:0;border-radius:14px;padding:12px 16px;font-weight:900}.top button,.cat{background:#eee}.mode{background:#65483b;color:#fff}.app{max-width:1200px;margin:auto;padding:15px}.layout{display:grid;grid-template-columns:150px 1fr 310px;gap:14px}.panel{background:white;border-radius:20px;padding:14px}.cat{width:100%;margin-bottom:8px}.cat.on{background:#65483b;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:0;background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0002;text-align:left;padding:0}.food{height:150px;background-image:url('assets/menu-sheet.jpg');background-size:600% 600%;background-repeat:no-repeat}.txt{padding:10px;font-weight:900}.price{color:#65483b;margin-top:4px}.cartrow{padding:10px;background:#f3ebe5;border-radius:12px;margin:8px 0}.total{border-top:2px dashed #ccc;margin-top:12px;padding-top:12px;font-size:20px;font-weight:900;display:flex;justify-content:space-between}.pay{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:#65483b;color:#fff;font-weight:900}.pay:disabled{opacity:.4}.hidden{display:none}.mission{background:#fff3c9;border:3px solid #efc453;border-radius:18px;padding:14px;margin-bottom:12px;font-weight:900}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:10}.modal{background:white;border-radius:22px;padding:22px;width:min(500px,90vw)}.methods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.methods button,.modal button{padding:16px;border:0;border-radius:14px;font-weight:900}.methods button{background:#f1e5dc}.receipt{border:1px solid #aaa;padding:20px;font-family:monospace}.receipt h2{text-align:center}.receipt div{margin:7px 0}.close{width:100%;background:#65483b;color:white;margin-top:14px}@media(max-width:800px){.stores{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.cats{display:flex;overflow:auto;gap:6px}.cat{min-width:95px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><section id="home" class="wrap"><div class="hero"><h1>어디에서 주문할까요?</h1><p>원하는 가게를 선택해서 키오스크 주문을 연습해 보세요.</p></div><div class="stores"><button class="store" onclick="enter('cafe')"><div class="pic cafe"></div><div class="label"><b>카페</b><div>커피 · 스무디 · 차 · 에이드 · 디저트</div></div></button><button class="store" onclick="enter('burger')"><div class="pic burger"></div><div class="label"><b>햄버거 가게</b><div>버거 · 세트 · 사이드 · 치킨 · 음료</div></div></button><button class="store" onclick="enter('bunsik')"><div class="pic bunsik"></div><div class="label"><b>분식집</b><div>떡볶이 · 김밥 · 튀김 · 면 · 식사</div></div></button></div></section><section id="kiosk" class="hidden"><div class="top"><button onclick="home()">← 가게 선택</button><b id="shop"></b><div><button onclick="setMode(false)">자유 연습</button> <button class="mode" onclick="setMode(true)">미션 연습</button></div></div><main class="app"><div id="mission" class="mission hidden"></div><div class="layout"><aside class="panel cats" id="cats"></aside><section class="panel"><h2 id="ct"></h2><div id="grid" class="grid"></div></section><aside class="panel"><h2>장바구니</h2><div id="cart">메뉴를 선택해 주세요.</div><div class="total"><span>총 금액</span><span id="sum">0원</span></div><button id="pay" class="pay" disabled onclick="payment()">결제하기</button></aside></div></main></section><div id="pop"></div><script>
const D={cafe:{n:'카페',c:{'커피':[['아메리카노',4000],['카페라떼',4500],['바닐라라떼',5000],['카라멜마키아토',5200],['카페모카',5000],['아인슈페너',5500]],'스무디':[['딸기 스무디',5500],['망고 스무디',5500],['블루베리 스무디',5800],['요거트 스무디',5200]],'차':[['녹차라떼',4500],['초코라떼',4500],['레몬차',4200],['자몽차',4500]],'에이드':[['레몬에이드',4800],['청포도에이드',5000],['자몽에이드',5000]],'디저트':[['딸기케이크',5500],['초코케이크',5800],['크루아상',3800],['초코쿠키',2500]]}},burger:{n:'햄버거 가게',c:{'버거':[['불고기버거',4800],['치즈버거',5000],['더블치즈버거',6500],['베이컨버거',6200],['치킨버거',5500],['새우버거',5600]],'세트':[['불고기버거 세트',7800],['치즈버거 세트',8000],['치킨버거 세트',8500],['새우버거 세트',8600]],'사이드':[['감자튀김',2500],['어니언링',3000],['치즈스틱',2800],['치킨너겟',3200]],'치킨':[['치킨윙',4500],['치킨텐더',4800]],'음료':[['콜라',2200],['사이다',2200],['오렌지주스',2800]]}},bunsik:{n:'분식집',c:{'떡볶이':[['떡볶이',4000],['치즈떡볶이',5000],['로제떡볶이',5500],['라볶이',5000]],'김밥':[['김밥',3000],['참치김밥',4000],['치즈김밥',3800],['돈가스김밥',4500]],'튀김':[['모둠튀김',4500],['김말이',3000],['오징어튀김',3500],['야채튀김',3000]],'면':[['라면',4000],['쫄면',5000],['우동',5000]],'식사':[['돈가스',7500],['김치볶음밥',6500],['오므라이스',7000]]}}};let S,cat,basket=[],mission=false;function enter(s){S=s;document.getElementById('home').classList.add('hidden');document.getElementById('kiosk').classList.remove('hidden');document.getElementById('shop').textContent=D[s].n+' 키오스크';basket=[];renderCats();renderCart()}function home(){document.getElementById('kiosk').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}function renderCats(){let ks=Object.keys(D[S].c);cat=ks[0];document.getElementById('cats').innerHTML=ks.map((x,i)=>`<button class="cat ${i?'':'on'}" onclick="choose('${x}',this)">${x}</button>`).join('');renderGrid()}function choose(x,b){cat=x;document.querySelectorAll('.cat').forEach(e=>e.classList.remove('on'));b.classList.add('on');renderGrid()}function renderGrid(){document.getElementById('ct').textContent=cat;let all=Object.values(D[S].c).flat(), base=all.findIndex(x=>x===D[S].c[cat][0]);document.getElementById('grid').innerHTML=D[S].c[cat].map((x,i)=>{let k=(base+i)%36,r=Math.floor(k/6),c=k%6;return `<button class="item" onclick="add('${x[0]}',${x[1]})"><div class="food" style="background-position:${c*20}% ${r*20}%"></div><div class="txt">${x[0]}<div class="price">${x[1].toLocaleString()}원</div></div></button>`}).join('')}function add(n,p){let z=basket.find(x=>x.n===n);z?z.q++:basket.push({n,p,q:1});renderCart()}function renderCart(){let e=document.getElementById('cart'),sum=basket.reduce((a,x)=>a+x.p*x.q,0);e.innerHTML=basket.length?basket.map(x=>`<div class="cartrow"><b>${x.n}</b><div>${x.q}개 · ${(x.p*x.q).toLocaleString()}원</div></div>`).join(''):'메뉴를 선택해 주세요.';document.getElementById('sum').textContent=sum.toLocaleString()+'원';document.getElementById('pay').disabled=!basket.length}function setMode(v){mission=v;let m=document.getElementById('mission');if(v){let cats=Object.values(D[S].c).flat(),x=cats[Math.floor(Math.random()*cats.length)];m.textContent=`미션: ${x[0]} 1개를 주문하고 결제해 보세요.`;m.classList.remove('hidden')}else m.classList.add('hidden')}function payment(){document.getElementById('pop').innerHTML=`<div class="overlay"><div class="modal"><h2>결제 방법을 선택하세요</h2><div class="methods"><button onclick="done('카드')">💳 카드 결제</button><button onclick="done('현금')">현금 결제</button></div></div></div>`}function done(method){let total=basket.reduce((a,x)=>a+x.p*x.q,0),no=Math.floor(1000+Math.random()*9000);document.getElementById('pop').innerHTML=`<div class="overlay"><div class="modal"><div class="receipt"><h2>${D[S].n}</h2><hr>${basket.map(x=>`<div>${x.n} × ${x.q}　${(x.p*x.q).toLocaleString()}원</div>`).join('')}<hr><div><b>합계　${total.toLocaleString()}원</b></div><div>결제　${method}</div><hr><h3 style="text-align:center">주문번호 ${no}</h3></div><button class="close" onclick="finish()">확인</button></div></div>`}function finish(){document.getElementById('pop').innerHTML='';basket=[];renderCart()}
</script></body></html>
