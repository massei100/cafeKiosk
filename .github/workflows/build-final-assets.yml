name: Validate kiosk build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit entry, selectors and preserved photos
        run: |
          node --check final.js
          python3 tests/audit.py
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium --only-shell
      - name: Verify complete kiosk flow in Chromium
        run: node tests/kiosk-flow.cjs
