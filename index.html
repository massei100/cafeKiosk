tById(x),W=n=>n.toLocaleString()+'원';function enter(s){S=s;$('home').classList.add('hide');$('kiosk').classList.remove('hide');$('shop').textContent=D[s].n+' 키오스크';B=[];cats();cart()}function home(){$('kiosk').classList.add('hide');$('home').classList.remove('hide')}function cats(){let a=Object.keys(D[S].c);C=a[0];$('cats').innerHTML=a.map((x,i)=>`<button class="cat ${i?'':'on'}" onclick="choose('${x}',this)">${x}</button>`).join('');grid()}function choose(x,b){C=x;document.querySelectorAll('.cat').forEach(e=>e.classList.remove('on'));b.classList.add('on');grid()}function grid(){$('ct').textContent=C;let all=Object.values(D[S].c).flat(),base=all.indexOf(D[S].c[C][0]);$('grid').innerHTML=D[S].c[C].map((x,i)=>{let k=(D[S].o+base+i)%36,r=Math.floor(k/6),c=k%6;return `<button class="item" onclick="add('${x[0]}',${x[1]})"><div class="food" style="background-position:${c*20}% ${r*20}%"></div><div class="txt">${x[0]}<div class="price">${W(x[1])}</div></div></button>`}).join('')}function add(n,p){let z=B.find(x=>x.n===n);z?z.q++:B.push({n,p,q:1});cart()}function cart(){let t=B.reduce((a,x)=>a+x.p*x.q,0);$('cart').innerHTML=B.length?B.map(x=>`<div class="row"><b>${x.n}</b><div>${x.q}개 · ${W(x.p*x.q)}</div></div>`).join(''):'메뉴를 선택해 주세요.';$('sum').textContent=W(t);$('pay').disabled=!B.length}function mode(v){$('free').classList.toggle('on',!v);$('mis').classList.toggle('on',!!v);$('mission').classList.toggle('hide',!v);if(v){let a=Object.values(D[S].c).flat(),x=a[Math.floor(Math.random()*a.length)];$('mission').textContent=`미션: ${x[0]} 1개를 주문하고 결제해 보세요.`}}function pay(){$('pop').innerHTML=`<div class="ov"><div class="modal"><h2>결제 방법을 선택하세요</h2><div class="methods"><button onclick="done('카드')">카드 결제</button><button onclick="done('현금')">현금 결제</button></div></div></div>`}function done(m){let t=B.reduce((a,x)=>a+x.p*x.q,0),no=Math.floor(1000+Math.random()*9000);$('pop').innerHTML=`<div class="ov"><div class="modal"><div class="receipt"><h2>${D[S].n}</h2><hr>${B.map(x=>`<div>${x.n} × ${x.q}　${W(x.p*x.q)}</div>`).join('')}<hr><b>합계　${W(t)}</b><div>결제　${m}</div><hr><h3 style="text-align:center">주문번호 ${no}</h3></div><button class="ok" onclick="finish()">확인</button></div></div>`}function finish(){$('pop').innerHTML='';B=[];cart()}</script></body></html>
