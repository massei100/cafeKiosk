name: Replace menu photos with real food photography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-menu-photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow requests
      - name: Fetch real menu photographs from Wikimedia Commons
        run: |
          cat > /tmp/photos.py <<'PY'
          import os, requests, io, time
          from PIL import Image,ImageOps,UnidentifiedImageError
          items={
          'cafe_americano.webp':'Americano coffee','cafe_cafelatte.webp':'caffe latte','cafe_vanillalatte.webp':'vanilla latte','cafe_caramelmacchiato.webp':'caramel macchiato','cafe_cafemocha.webp':'cafe mocha','cafe_einspanner.webp':'Vienna coffee cream','cafe_strawberrysmoothie.webp':'strawberry smoothie','cafe_mangosmoothie.webp':'mango smoothie','cafe_blueberrysmoothie.webp':'blueberry smoothie','cafe_yogurtsmoothie.webp':'yogurt smoothie','cafe_lemontea.webp':'lemon tea','cafe_grapefruittea.webp':'grapefruit tea','cafe_greentealatte.webp':'matcha latte','cafe_chocolatelatte.webp':'hot chocolate','cafe_lemonade.webp':'lemonade drink','cafe_grapefruitade.webp':'grapefruit soda drink','cafe_softicecream.webp':'soft serve ice cream',
          'burger_bulgogiburger.webp':'bulgogi burger','burger_cheeseburger.webp':'cheeseburger','burger_doublecheeseburger.webp':'double cheeseburger','burger_baconburger.webp':'bacon cheeseburger','burger_chickenburger.webp':'chicken burger','burger_shrimpburger.webp':'shrimp burger','burger_bulgogiset.webp':'hamburger french fries soda meal','burger_cheeseburgerset.webp':'cheeseburger fries soda meal','burger_frenchfries.webp':'french fries','burger_onionrings.webp':'onion rings food','burger_cheesesticks.webp':'mozzarella sticks','burger_chickennuggets.webp':'chicken nuggets','burger_cola.webp':'cola glass','burger_cider.webp':'lemon lime soda glass','burger_softicecream.webp':'soft serve ice cream',
          'bunsik_tteokbokki.webp':'tteokbokki','bunsik_cheesetteokbokki.webp':'cheese tteokbokki','bunsik_rosetteokbokki.webp':'rose tteokbokki','bunsik_rabokki.webp':'rabokki','bunsik_gimbap.webp':'gimbap','bunsik_tunagimbap.webp':'tuna gimbap','bunsik_cheesegimbap.webp':'cheese gimbap','bunsik_porkcutletgimbap.webp':'pork cutlet gimbap','bunsik_assortedtempura.webp':'Korean twigim fried food','bunsik_gimmari.webp':'gimmari fried seaweed roll','bunsik_squidtempura.webp':'fried squid tempura','bunsik_vegetabletempura.webp':'vegetable tempura','bunsik_ramen.webp':'Korean ramyeon','bunsik_jjolmyeon.webp':'jjolmyeon','bunsik_udon.webp':'udon noodles','bunsik_cola.webp':'cola glass','bunsik_cider.webp':'lemon lime soda glass'}
          api='https://commons.wikimedia.org/w/api.php'; headers={'User-Agent':'CafeKioskEducation/1.1 (educational kiosk)'}
          os.makedirs('assets-final',exist_ok=True); done=0
          for fn,q in items.items():
            params={'action':'query','generator':'search','gsrsearch':q,'gsrnamespace':6,'gsrlimit':20,'prop':'imageinfo','iiprop':'url|size|mime','iiurlwidth':1600,'format':'json'}
            try: data=requests.get(api,params=params,headers=headers,timeout=30).json()
            except Exception as e: print('SEARCH ERROR',fn,e); continue
            pages=list(data.get('query',{}).get('pages',{}).values()); candidates=[]
            for p in pages:
              ii=(p.get('imageinfo') or [{}])[0]; w=ii.get('width',0); h=ii.get('height',0); u=ii.get('thumburl') or ii.get('url'); mime=ii.get('mime','')
              if u and mime.startswith('image/') and w>=700 and h>=500: candidates.append((w*h,u,p.get('title','')))
            candidates.sort(reverse=True)
            saved=False
            for _,url,title in candidates:
              try:
                r=requests.get(url,headers=headers,timeout=60); r.raise_for_status()
                if not r.headers.get('content-type','').lower().startswith('image/'): continue
                im=Image.open(io.BytesIO(r.content)); im.load(); im=im.convert('RGB')
                im=ImageOps.fit(im,(1200,900),method=Image.Resampling.LANCZOS,centering=(.5,.5)); im.save('assets-final/'+fn,'WEBP',quality=88,method=6)
                print('SAVED',fn,'<-',title); done+=1; saved=True; break
              except Exception as e: print('SKIP',fn,title,type(e).__name__)
            if not saved: print('NO USABLE PHOTO',fn,q)
            time.sleep(.1)
          print('TOTAL SAVED',done,'OF',len(items))
          if done < 35: raise SystemExit('Too few valid photographs downloaded; refusing partial replacement')
          PY
          python /tmp/photos.py
      - name: Commit real photo assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets-final
          git diff --cached --quiet && exit 0
          git commit -m "Replace kiosk menu assets with real food photographs"
          git push
