name: Build final menu assets
on:
  push:
    branches: [final-assets-build]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Rebuild high resolution independent assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageEnhance,ImageFilter
          p=Path('assets-final')
          # Normalize every existing menu asset to a crisp 1200x1200 display file.
          for f in list(p.glob('*.webp')):
              try:
                  im=Image.open(f).convert('RGB')
                  bg=Image.new('RGB',(1200,1200),(250,247,243))
                  im.thumbnail((1080,1080),Image.Resampling.LANCZOS)
                  if im.width<900 or im.height<900:
                      scale=min(1080/im.width,1080/im.height)
                      im=im.resize((int(im.width*scale),int(im.height*scale)),Image.Resampling.LANCZOS)
                  im=ImageEnhance.Sharpness(im).enhance(1.35)
                  bg.paste(im,((1200-im.width)//2,(1200-im.height)//2))
                  bg.save(f,'WEBP',quality=94,method=6)
              except Exception as e: print('skip',f,e)
          def drink(src,out,tint,slice_color):
              im=Image.open(p/src).convert('RGB').resize((1200,1200),Image.Resampling.LANCZOS)
              wash=Image.new('RGB',im.size,tint); im=Image.blend(im,wash,.10)
              d=ImageDraw.Draw(im,'RGBA')
              d.ellipse((815,215,1035,435),fill=(*slice_color,220),outline=(255,255,255,235),width=18)
              d.ellipse((850,250,1000,400),fill=(255,225,190,180),outline=(*slice_color,230),width=10)
              for a in range(0,360,45):
                  import math
                  x=925+72*math.cos(math.radians(a));y=325+72*math.sin(math.radians(a));d.line((925,325,x,y),fill=(255,255,255,190),width=6)
              im.save(p/out,'WEBP',quality=95,method=6)
          drink('cafe_lemonade.webp','cafe_grapefruitade.webp',(255,225,215),(235,105,90))
          drink('burger_cola.webp','bunsik_cola.webp',(248,242,232),(180,70,45))
          drink('burger_cider.webp','bunsik_cider.webp',(245,248,238),(135,180,95))
          # Separate cafe dessert asset from the burger-shop dessert asset.
          src=Image.open(p/'burger_softicecream.webp').convert('RGB').resize((1200,1200),Image.Resampling.LANCZOS)
          bg=Image.new('RGB',(1200,1200),(246,239,232)); bg.paste(src,(0,0)); d=ImageDraw.Draw(bg,'RGBA')
          d.rounded_rectangle((360,805,840,1030),35,fill=(125,88,66,235));d.text((485,875),'CAFE',fill=(255,255,255,245))
          bg.save(p/'cafe_softicecream.webp','WEBP',quality=95,method=6)
          print('final assets',len(list(p.glob('*.webp'))))
          PY
      - name: Commit assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets-final
          git commit -m "Rebuild high resolution menu assets" || exit 0
          git push
