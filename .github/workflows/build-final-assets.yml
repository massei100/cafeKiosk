name: Validate kiosk build
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required app files
        run: |
          test -f index.html
          test -f final.js
          test -f final.css
          echo "Kiosk source files present. Menu image assets are maintained explicitly; no synthetic image generation is allowed."
