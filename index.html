function plateFood(type){if(type.includes('gimbap'))return svg(`<ellipse cx="110" cy="128" rx="78" ry="15" fill="#eee"/><g filter="url(#sh)">${[55,85,115,145].map((x,i)=>`<g transform="translate(${x} ${78+(i%2)*12}) rotate(${i%2?8:-6})"><ellipse rx="23" ry="18" fill="#171717"/><ellipse rx="17" ry="13" fill="#f4f0dd"/><rect x="-6" y="-9" width="12" height="18" rx="3" fill="${type==='gimbapTuna'?'#d58b72':type==='gimbapCheese'?'#f1c942':type==='gimbapMeat'?'#8e4e35':'#ef8b4b'}"/><rect x="-14" y="-3" width="7" height="6" fill="#70a34a"/></g>`).join('')}</g>`);if(type==='fries')return svg(`<g filter="url(#sh)" fill="#f6c549">${[62,76,90,104,118,132,146].map((x,i)=>`<rect x="${x}" y="${35+(i%3)*9}" width="13" height="80" rx="5" transform="rotate(${(i-3)*3} ${x} 80)"/>`).join('')}</g><path d="M54 82h112l-12 54H66z" fill="#d94b2a"/>`);if(type==='onion')return svg(`<ellipse cx="110" cy="126" rx="75" ry="14" fill="#eee"/><g fill="none" stroke="#d99742" stroke-width="14" filter="url(#sh)"><circle cx="80" cy="85" r="24"/><circle cx="127" cy="84" r="25"/><circle cx="105" cy="112" r="20"/></g>`);if(type==='stick'||type==='fishcake')return svg(`<ellipse cx="110" cy="129" rx="76" ry="14" fill="#eee"/><g fill="#dfaa55" filter="url(#sh)"><rect x="50" y="60" width="110" height="18" rx="9" transform="rotate(-10 105 69)"/><rect x="54" y="84" width="108" height="18" rx="9" transform="rotate(8 108 93)"/><rect x="64" y="106" width="96" height="18" rx="9" transform="rotate(-5 112 115)"/></g>`);if(['nugget','wing','tender','fry','dumpling','sweetpotato','squid','mandu'].includes(type))return svg(`<ellipse cx="110" cy="128" rx="78" ry="15" fill="#eee"/><g fill="${type==='dumpling'||type==='mandu'?'#ead2a6':'#d9933d'}" filter="url(#sh)">${[[67,77,27,20],[111,68,30,22],[148,84,26,20],[91,105,28,21],[135,111,30,22]].map(a=>`<ellipse cx="${a[0]}" cy="${a[1]}" rx="${a[2]}" ry="${a[3]}"/>`).join('')}</g>`);if(type==='croissant')return svg(`<ellipse cx="110" cy="128" rx="74" ry="13" fill="#eee"/><path d="M54 103q15-65 56-25q40-38 57 24q-25-20-42-4q-15 16-31 0q-17-15-40 5z" fill="#d99a47" filter="url(#sh)"/><path d="M79 82q8 22 17 37M110 75v46M141 82q-8 22-17 37" stroke="#b87432" stroke-width="5" fill="none"/>`);if(type==='cookie')return svg(`<circle cx="110" cy="82" r="53" fill="#c98648" filter="url(#sh)"/><g fill="#553023">${[[86,55],[126,54],[96,87],[139,91],[113,112],[74,97]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6"/>`).join('')}</g>`);if(type.includes('cake'))return svg(`<ellipse cx="110" cy="133" rx="65" ry="10" fill="#eee"/><path d="M62 58h96v64H62z" fill="${type==='chocake'?'#6e3b2c':'#f0c7b0'}" filter="url(#sh)"/><path d="M62 58h96v16H62z" fill="#fff4eb"/><path d="M62 91h96v10H62z" fill="${type==='chocake'?'#3f221c':'#fff2e8'}"/><circle cx="110" cy="53" r="12" fill="#d94747"/>`);return plateFood('nugget')}
function art(t){if(t==='coffeeDark')return cup('url(#coffee)');if(t==='latte')return cup('url(#milk)');if(t==='creamCoffee'||t==='caramel')return cup('#b27648',true);if(t==='mocha'||t==='choco')return cup('#5f3028',true);if(t==='pink')return glass('#ef7f90');if(t==='yellow')return glass('#f6c44a');if(t==='purple')return glass('#8a5fa8');if(t==='whiteDrink')return glass('#eee4db');if(t==='green')return glass('#8aa25a');if(t==='tea')return glass('#d9a653');if(t==='teaRed')return glass('#d66c58');if(t==='adeYellow')return glass('#efd75a');if(t==='adeGreen')return glass('#9acb78');if(t==='adePink')return glass('#ef8f9c');if(t==='cola')return glass('#4b261d');if(t==='clearDrink')return glass('#dfeff3');if(t==='orangeDrink')return glass('#f39a36');if(t==='water')return glass('#cfe9f5');if(['burger','burgerCheese','doubleBurger','burgerBacon','chickenBurger','shrimpBurger','burgerSet'].includes(t))return burger(t==='doubleBurger'?'<rect x="63" y="80" width="94" height="7" fill="#ffd34e"/>':t==='burgerCheese'?'<path d="M70 84h80l-10 12-30-7-30 7z" fill="#ffd34e"/>':'');if(['fries','onion','stick','nugget','wing','tender','fry','dumpling','sweetpotato','squid','fishcake','mandu','croissant','cookie','cake','chocake','gimbap','gimbapTuna','gimbapCheese','gimbapMeat'].includes(t))return plateFood(t);if(t==='tteok'||t==='spicyTteok')return bowl('#d6382f','<g fill="#fff0dc">'+[70,90,110,130,150].map(x=>`<rect x="${x}" y="52" width="15" height="38" rx="7" transform="rotate(${(x-110)/8} ${x} 70)"/>`).join('')+'</g>');if(t==='cheeseTteok')return bowl('#dd4738','<path d="M65 57q45-20 90 0l-18 28q-30-12-55 0z" fill="#f4d85c"/>');if(t==='roseTteok')return bowl('#e88f7c','<g fill="#fff0dc"><rect x="75" y="52" width="18" height="42" rx="9"/><rect x="105" y="49" width="18" height="45" rx="9"/><rect x="135" y="54" width="18" height="40" rx="9"/></g>');if(t==='blackTteok')return bowl('#4a3026','<g fill="#efe1cf"><rect x="78" y="50" width="18" height="42" rx="9"/><rect x="110" y="48" width="18" height="44" rx="9"/><rect x="140" y="54" width="18" height="38" rx="9"/></g>');if(['ramen','udon','jjol'].includes(t))return bowl(t==='jjol'?'#d64a38':'#c87a3b','<g stroke="#f0d36b" stroke-width="5" fill="none"><path d="M65 55q25 40 48 0t42 0"/><path d="M70 68q30 35 75 0"/></g>');if(t==='sundaeFood')return bowl('#dfddd5','<g fill="#3f2e2b"><circle cx="82" cy="62" r="15"/><circle cx="115" cy="57" r="16"/><circle cx="145" cy="68" r="15"/></g>');if(t==='icecream')return svg('<path d="M88 75h44l-22 65z" fill="#d9a45a"/><path d="M76 78q4-38 34-38t34 38z" fill="#fff5ec" filter="url(#sh)"/>');if(t==='sundae')return svg('<path d="M76 45h68l-8 86H84z" fill="#f5e8dd" filter="url(#sh)"/><path d="M82 60h56l-5 45H87z" fill="#8a4d36"/><circle cx="110" cy="48" r="14" fill="#fff4eb"/>');return plateFood('nugget')}
function hero(kind){if(kind==='cafe')return `<div style="display:flex;gap:8px;align-items:end">${art('coffeeDark')}${art('cake')}</div>`;if(kind==='burger')return art('burgerSet');return `<div style="display:flex;gap:4px;align-items:end">${art('tteok')}${art('gimbap')}</div>`}
$('#hero-cafe').innerHTML=hero('cafe');$('#hero-burger').innerHTML=hero('burger');$('#hero-bunsik').innerHTML=hero('bunsik');
function allItems(){let a=[];for(const[c,items] of Object.entries(menu[store].cats))for(const x of items)a.push({id:x[0],name:x[1],price:x[2],art:x[3],temp:!!x[4],size:!!x[5],cat:c});return a}function getItem(id){return allItems().find(x=>x.id===id)}
function enter(s){store=s;document.body.className='theme-'+s;$('#home').classList.add('hidden');$('#kiosk').classList.remove('hidden');$('#title').textContent=menu[s].name+' 키오스크';cat=Object.keys(menu[s].cats)[0];cart=[];mode='free';$('#free').classList.add('active');$('#missionBtn').classList.remove('active');$('#mission').classList.remove('show');render()}function goHome(){closeM();$('#kiosk').classList.add('hidden');$('#home').classList.remove('hidden');document.body.className=''}function render(){renderCats();renderGrid();renderCart()}function renderCats(){$('#cats').innerHTML=Object.keys(menu[store].cats).map(c=>`<button class="cat ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}function setCat(c){cat=c;renderCats();renderGrid()}function renderGrid(){$('#catTitle').textContent=cat;$('#grid').innerHTML=menu[store].cats[cat].map(x=>`<button class="menu" onclick="openItem('${x[0]}')"><div class="pic">${art(x[3])}</div><div class="info"><div class="name">${x[1]}</div><div class="price">${won(x[2])}${x[5]?'~':''}</div></div></button>`).join('')}
function openItem(id){const x=getItem(id);temp=x.temp?'ICE':'없음';size=x.size?'보통':'없음';$('#modal').innerHTML=`<div class="mh"><h3>${x.name}</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><div class="pic" style="height:190px">${art(x.art)}</div>${x.temp?`<div class="group"><b>온도를 선택하세요</b><div class="opts"><button id="hot" class="opt" onclick="pickTemp('HOT')">HOT</button><button id="ice" class="opt sel" onclick="pickTemp('ICE')">ICE</button></div></div>`:''}${x.size?`<div class="group"><b>크기를 선택하세요</b><div class="opts"><button id="normal" class="opt sel" onclick="pickSize('보통')">보통</button><button id="large" class="opt" onclick="pickSize('큰 사이즈')">큰 사이즈 +500원</button></div></div>`:''}<button class="add" onclick="addCart('${id}')">장바구니에 담기</button></div>`;$('#ov').classList.add('show')}function pickTemp(v){temp=v;['hot','ice'].forEach(i=>$('#'+i)?.classList.remove('sel'));$('#'+(v==='HOT'?'hot':'ice'))?.classList.add('sel')}function pickSize(v){size=v;['normal','large'].forEach(i=>$('#'+i)?.classList.remove('sel'));$('#'+(v==='보통'?'normal':'large'))?.classList.add('sel')}function closeM(){$('#ov').classList.remove('show')}
function addCart(id){const x=getItem(id),fp=x.price+(size==='큰 사이즈'?500:0),key=[id,temp,size].join('|'),old=cart.find(i=>i.key===key);if(old)old.qty++;else cart.push({...x,key,temp,size,fp,qty:1});closeM();renderCart()}function renderCart(){const b=$('#cart');b.innerHTML=!cart.length?'<div class="empty">메뉴를 선택해 주세요.</div>':cart.map((i,n)=>`<div class="ci"><div class="cl"><span>${i.name}</span><span>${won(i.fp*i.qty)}</span></div><div class="co">${[i.temp!=='없음'?i.temp:'',i.size!=='없음'?i.size:''].filter(Boolean).join(' · ')}</div><div class="qc"><button class="q" onclick="qty(${n},-1)">−</button><b>${i.qty}</b><button class="q" onclick="qty(${n},1)">+</button></div></div>`).join('');$('#total').textContent=won(total());$('#checkout').disabled=!cart.length}function qty(n,d){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);renderCart()}function total(){return cart.reduce((s,i)=>s+i.fp*i.qty,0)}
function checkout(){$('#modal').innerHTML=`<div class="mh"><h3>결제 방법을 선택하세요</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><div class="payments"><button class="method" onclick="cardPay()">카드 결제</button><button class="method" onclick="cashPay()">현금 결제</button></div><div class="sum"><b>결제할 금액</b><br><span style="font-size:1.4rem;font-weight:950">${won(total())}</span></div></div>`;$('#ov').classList.add('show')}function cardPay(){$('#modal').innerHTML=`<div class="mh"><h3>카드 결제</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><div style="height:180px;display:grid;place-items:center"><div style="width:180px;height:110px;border-radius:14px;background:linear-gradient(135deg,#1f344f,#54718d);box-shadow:0 14px 28px #0002;transform:rotate(-7deg);position:relative"><div style="width:30px;height:23px;border-radius:5px;background:#e1c565;position:absolute;left:22px;top:42px"></div><div style="position:absolute;left:22px;bottom:18px;color:white;font-weight:800;letter-spacing:2px">CARD</div></div></div><button class="primary" style="width:100%" onclick="finish('card',${total()})">카드 결제 완료</button></div>`}function cashPay(){paid=0;$('#modal').innerHTML=`<div class="mh"><h3>현금 결제</h3><button class="x" onclick="closeM()">×</button></div><div class="mb"><b>돈을 눌러 금액을 맞춰보세요.</b><div class="money" style="margin-top:10px">${[100,500,1000,5000,10000,50000].map(v=>`<button onclick="addMoney(${v})">${won(v)}</button>`).join('')}</div><div class="sum"><div>상품 금액: <b>${won(total())}</b></div><div>낸 금액: <b id="paid">0원</b></div><div>거스름돈: <b id="change">0원</b></div></div><div class="actions"><button class="secondary" onclick="paid=0;updateMoney()">다시 내기</button><button class="primary" onclick="finishCash()">결제하기</button></div></div>`}function addMoney(v){paid+=v;updateMoney()}function updateMoney(){$('#paid').textContent=won(paid);$('#change').textContent=won(Math.max(0,paid-total()))}function finishCash(){if(paid<total())return alert('금액이 부족해요.');finish('cash',paid)}
function finish(method,amt){const no=Math.floor(100+Math.random()*900),res=mode==='mission'?checkMission(method):'',rows=cart.map(i=>`<div class="rl"><span>${i.name} x${i.qty}</span><span>${won(i.fp*i.qty)}</span></div>`).join('');$('#modal').innerHTML=`<div class="mh"><h3>주문 완료</h3><button class="x" onclick="resetOrder()">×</button></div><div class="mb">${res}<div class="receipt"><h2>${menu[store].name}</h2><div style="text-align:center">키오스크 주문 연습</div><hr><div style="text-align:center">주문번호</div><div class="ord">${no}</div><hr>${rows}<hr><div class="rl"><b>합계</b><b>${won(total())}</b></div><div class="rl"><span>결제</span><span>${method==='cash'?'현금':'카드'}</span></div>${method==='cash'?`<div class="rl"><span>받은 금액</span><span>${won(amt)}</span></div><div class="rl"><span>거스름돈</span><span>${won(amt-total())}</span></div>`:''}</div><button class="primary" style="width:100%;margin-top:13px" onclick="resetOrder()">처음으로</button></div>`}function resetOrder(){closeM();cart=[];renderCart();if(mode==='mission')makeMission()}
function makeMission(){const all=allItems(),count=Math.random()<.55?1:2,p=[];while(p.length<count){const x=all[Math.floor(Math.random()*all.length)];if(!p.find(y=>y.id===x.id))p.push(x)}const its=p.map(x=>({id:x.id,name:x.name,temp:x.temp?(Math.random()<.5?'ICE':'HOT'):'없음',size:x.size?(Math.random()<.7?'보통':'큰 사이즈'):'없음'})),method=Math.random()<.5?'card':'cash';mission={items:its,method};$('#missionText').textContent=its.map(i=>`${i.temp!=='없음'?i.temp+' ':''}${i.name}${i.size==='큰 사이즈'?' 큰 사이즈':''}`).join(' + ')+`를 주문하고 ${method==='cash'?'현금':'카드'}으로 결제하세요.`;cart=[];renderCart()}function checkMission(method){const d=[...mission.items].sort((a,b)=>a.id.localeCompare(b.id)),a=[];cart.forEach(i=>{for(let q=0;q<i.qty;q++)a.push({id:i.id,temp:i.temp,size:i.size})});a.sort((x,y)=>x.id.localeCompare(y.id));const ok=d.length===a.length&&d.every((x,n)=>x.id===a[n].id&&x.temp===a[n].temp&&x.size===a[n].size)&&method===mission.method;speak(ok?'미션 성공! 아주 잘했어요.':'미션을 다시 확인해 보세요.');return `<div class="result ${ok?'ok':'bad'}">${ok?'미션 성공! 정확하게 주문했어요.':'미션을 다시 확인해 보세요.'}</div>`}function setMode(m){mode=m;$('#free').classList.toggle('active',m==='free');$('#missionBtn').classList.toggle('active',m==='mission');$('#mission').classList.toggle('show',m==='mission');cart=[];renderCart();if(m==='mission')makeMission()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}
$('#free').onclick=()=>setMode('free');$('#missionBtn').onclick=()=>setMode('mission');$('#newMission').onclick=makeMission;$('#hear').onclick=()=>speak($('#missionText').textContent);$('#checkout').onclick=checkout;$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
</script></body></html>
