<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f3"><title>키오스크 주문 연습</title><link rel="stylesheet" href="style.css?v=3"></head><body><section id="home" class="wrap"><h1 class="title">어디에서 주문할까요?</h1><p class="sub">연습할 가게를 선택하세요.</p><div id="stores" class="stores"></div></section><section id="app" class="hidden"><header class="top"><div class="topin"><div class="left"><button class="pill" onclick="goHome()">← 가게 선택</button><div id="brand" class="brand"></div></div><div class="right"><button id="freeBtn" class="pill on" onclick="setMode('free')">자유 연습</button><button id="missionBtn" class="pill" onclick="setMode('mission')">미션 연습</button></div></div></header><main class="app"><div class="practice"><section class="pcard"><h3>어디에서 드시나요?</h3><div class="seg"><button id="dine" class="on" onclick="setOrderType('매장')">매장</button><button id="take" onclick="setOrderType('포장')">포장</button></div></section><section class="pcard"><h3>현재 연습</h3><div id="modeText" style="font-weight:950;color:var(--accent)">자유롭게 주문해 보세요.</div></section></div><section id="missionBox" class="mission hidden"><b>오늘의 주문 미션</b><div id="missionText" class="mtext"></div><div class="mactions"><button class="small" onclick="newMission()">새 미션</button><button class="small" onclick="speakMission()">다시 듣기</button></div></section><div class="layout"><aside class="panel cats"><div id="catlist" class="catlist"></div></aside><section class="panel menu"><div class="mhead2"><h2 id="catTitle"></h2><span>메뉴를 눌러 주문하세요.</span></div><div id="grid" class="grid"></div></section><aside class="panel cart"><h2>장바구니</h2><div id="cartBox"></div><div class="total"><span>총 금액</span><span id="total">0원</span></div><button id="pay" class="primary" disabled onclick="openPayment()">결제하기</button></aside></div></main></section><div id="modal"></div><script src="webp1.js?v=3"></script><script src="webp3.js?v=3"></script><script src="webp4.js?v=3"></script><script src="webp5.js?v=3"></script><script src="webp6.js?v=3"></script><script src="art.js?v=3"></script><script src="app.js?v=3"></script></body></html>
