:root{--a:#76503d;--s:#eee1d6;--bg:#f7f3ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:var(--bg);color:#211b18}button{font:inherit;border:0;cursor:pointer}.hide{display:none!important}.wrap{max-width:1180px;margin:auto;padding:18px}.title{text-align:center;font-size:clamp(2rem,5vw,3.8rem);margin:20px 0 5px}.sub{text-align:center;color:#756b65;font-weight:800}.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}.store,.panel{background:#fff;border-radius:24px;box-shadow:0 8px 24px #0001;overflow:hidden}.store{text-align:left}.store img{width:100%;aspect-ratio:5/3;object-fit:cover}.store div{padding:16px 18px}.store b{font-size:1.8rem}.store p{margin:6px 0;color:#766;font-weight:800}.top{position:sticky;top:0;z-index:10;background:#fff;display:flex;justify-content:space-between;gap:8px;padding:10px 14px;box-shadow:0 2px 10px #0001}.top>div{display:flex;gap:8px;align-items:center}.pill,.cat{padding:11px 14px;border-radius:14px;background:var(--s);color:var(--a);font-weight:950}.pill.on,.cat.on,.primary{background:var(--a);color:#fff}.shop{font-weight:1000}.mission{background:#fff6cf;border:2px solid #efc84f;border-radius:18px;padding:13px;margin-bottom:12px;font-weight:900}.layout{display:grid;grid-template-columns:145px 1fr 300px;gap:14px;align-items:start}.cats{padding:10px}.cat{width:100%;margin-bottom:8px}.menu{padding:14px}.mh{display:flex;justify-content:space-between;align-items:end}.mh h2{margin:0 0 10px;font-size:2rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{background:#fff;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 4px 15px #0001}.item img{width:100%;aspect-ratio:1;object-fit:cover}.txt{padding:10px 12px 13px}.nm{font-weight:1000;font-size:1.05rem}.pr{color:var(--a);font-weight:1000;margin-top:4px}.cart{padding:14px;position:sticky;top:68px}.cart h2{margin:0 0 10px}.empty{text-align:center;color:#988;padding:25px 0}.row{backgroun :900px){.layout{grid-template-columns:1fr}.cats{display:flex;overflow:auto;gap:7px}.cat{min-width:95px;margin:0}.cart{position:static}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.stores{grid-template-columns:1fr}.top{flex-wrap:wrap}.shop{display:none}.grid{gap:9px}.wrap{padding:12px}.item .nm{font-size:1rem}}
</style></head><body><section id="home" class="wrap"><h1 class="title">어디에서 주문할까요?</h1><p class="sub">연습할 가게를 선택하세요.</p><div id="stores" class="stores"></div></section><section id="app" class="hide"><header class="top"><div><button class="pill" onclick="home()">← 가게 선택</button><span id="shop" class="shop"></span></div><div><button id="free" class="pill on" onclick="modeSet('free')">자유 연습</button><button id="mis" class="pill" onclick="modeSet('mission')">미션 연습</button></div></header><main class="wrap"><div id="mission" class="mission hide"></div><div class="layout"><aside id="cats" class="panel cats"></aside><section class="panel menu"><div class="mh"><h2 id="ct"></h2><span>메뉴를 눌러 주문하세요.</span></div><div id="grid" class="grid"></div></section><aside class="panel cart"><h2>장바구니</h2><div id="cart"></div><div class="sum"><span>총 금액</span><span id="total">0원</span></div><button id="pay" class="primary" disabled onclick="pay()">결제하기</button></aside></div></main></section><div id="pop"></div>

const A=n=>ASSETS[n];const W=n=>n.toLocaleString('ko-KR')+'원';
const D={cafe:{n:'카페',hero:'cafe_hero.webp',desc:'커피 · 스무디 · 차 · 에이드 · 디저트',c:{'커피':[['아메리카노',4000,'cafe_americano.webp',1,1],['카페라떼',4500,'cafe_cafelatte.webp',1,1],['바닐라라떼',5000,'cafe_vanillalatte.webp',1,1],['카라멜마키아토',5200,'cafe_caramelmacchiato.webp',1,1],['카페모카',5000,'cafe_cafemocha.webp',1,1],['아인슈페너',5500,'cafe_einspanner.webp',0,1]],'스무디':[['딸기스무디',5500,'cafe_strawberrysmoothie.webp'],['망고스무디',5500,'cafe_mangosmoothie.webp'],['블루베리스무디',5800,'cafe_blueberrysmoothie.webp'],['요거트스무디',5200,'cafe_yogurtsmoothie.webp']],'차':[['레몬차',4200,'cafe_lemontea.webp',1,1],['자몽차',4500,'cafe_grapefruittea.webp',1,1],['녹차라떼',4500,'cafe_greentealatte.webp',1,1],['초코라떼',4500,'cafe_chocolatelatte.webp',1,1]],'에이드':[['레몬에이드',4800,'cafe_lemonade.webp'],['자몽에이드',5000,'cafe_grapefruittea.webp']],'디저트':[['소프트아이스크림',1800,'burger_icecream.webp']]},cls:''},burger:{n:'햄버거 가게',hero:'burger_hero.webp',desc:'버거 · 세트 · 사이드 · 치킨 · 음료 · 디저트',cls:'burger',c:{'버거':[['불고기버거',4800,'burger_bulgogiburger.webp'],['치즈버거',5000,'burger_cheeseburger.webp'],['더블치즈버거',6500,'burger_doublecheeseburger.webp'],['베이컨버거',6200,'burger_baconburger.webp'],['치킨버거',5500,'burger_chickenburger.webp'],['새우버거',5600,'burger_shrimpburger.webp']],'세트':[['불고기버거 세트',7800,'burger_bulgogiset.webp'],['치즈버거 세트',8000,'burger_cheeseburgerset.webp']],'사이드':[['감자튀김',2500,'burger_frenchfries.webp'],['어니언링',3000,'burger_onionrings.webp'],['치즈스틱',2800,'burger_cheesesticks.webp']],'치킨':[['치킨너겟',3200,'burger_chickennuggets.webp']],'음료':[['콜라',2200,'burger_cola.webp',0,1],['사이다',2200,'burger_cider.webp',0,1]],'디저트':[['소프트아이스크림',1800,'burger_icecream.webp']]}},bunsik:{n:'분식집',hero:'bunsik_hero.webp',desc:'떡볶이 · 김밥 · 튀김 · 면 · 식사 · 음료',cls:'bunsik',c:{'떡볶이':[['떡볶이',4000,'bunsik_tteokbokki.webp'],['치즈떡볶이',5000,'bunsik_cheesetteokbokki.webp'],['로제떡볶이',5500,'bunsik_rosetteokbokki.webp'],['라볶이',5000,'bunsik_rabokki.webp']],'김밥':[['김밥',3000,'bunsik_gimbap.webp'],['참치김밥',4000,'bunsik_tunagimbap.webp'],['치즈김밥',3800,'bunsik_cheesegimbap.webp'],['돈가스김밥 let S='',C='',cart=[],M='free',mission=null,money=0;const $=x=>document.getElementById(x);$('stores').innerHTML=Object.entries(D).map(([k,s])=>`<button class="store" onclick="enter('${k}')"><img src="${A(s.hero)}"><div><b>${s.n}</b><p>${s.desc}</p></div></button>`).join('');
function enter(k){S=k;C=Object.keys(D[k].c)[0];cart=[];document.body.className=D[k].cls;$('home').classList.add('hide');$('app').classList.remove('hide');$('shop').textContent=D[k].n+' 키오스크';modeSet('free');renderCats();render();renderCart()}function home(){$('app').classList.add('hide');$('home').classList.remove('hide');document.body.className='';$('pop').innerHTML=''}function modeSet(m){M=m;$('free').classList.toggle('on',m==='free');$('mis').classList.toggle('on',m==='mission');$('mission').classList.toggle('hide',m!=='mission');if(m==='mission')newMission()}function renderCats(){$('cats').innerHTML=Object.keys(D[S].c).map(x=>`<button class="cat ${x===C?'on':''}" onclick="C='${x}';renderCats();render()">${x}</button>`).join('')}function render(){$('ct').textContent=C;$('grid').innerHTML=D[S].c[C].map((x,i)=>`<button class="item" onclick="detail(${i})"><img src="${A(x[2])}"><div class="txt"><div class="nm">${x[0]}</div><div class="pr">${W(x[1])}</div></div></button>`).join('')}function detail(i){let x=D[S].c[C][i],temp=x[3]?'ICE':'없음',size=x[4]?'보통':'없음';modal(`<div class="head"><h3>${x[0]}</h3><button class="x" onclick="closePop()">×</button></div><div class="body"><img class="detail" src="${A(x[2])}">${x[3]?`<div class="group"><b>온도를 선택하세요</b><div class="opts"><button class="choice sel" onclick="pick(this,'ICE')">ICE</button><button class="choice" onclick="pick(this,'HOT')">HOT</button></div></div>`:''}${x[4]?`<div class="group"><b>크기를 선택하세요</b><div class="opts"><button class="choice sel" onclick="pickSize(this,'보통')">보통</button><button class="choice" onclick="pickSize(this,'큰 사이즈')">큰 사이즈 +500원</button></div></div>`:''}<button class="primary" onclick="add('${x[0]}',${x[1]},'${x[2]}')">장바구니에 담기</button></div>`);window.T=temp;window.Z=size}function pick(b,v){T=v;b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function pickSize(b,v){Z=v;b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function add(n,p,img){let price=p+(Z==='큰 사이즈'?500:0),key=n+T+Z,e=cart.find(x=>x.key===key);e?e.q++:cart.push({key,n,p:price,t:T,z:Z,q:1,img});closePop();renderCart()}function renderCart(){let t=cart.reduce((a,x)=>a+x.p*x.q,0);$('cart').innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><div class="line"><span>${x.n}</span><span>${W(x.p*x.q)}</span></div><div class="optline">${[x.t!=='없음'?x.t:'',x.z!=='없음'?x.z:''].filter(Boolean).join(' · ')}</div><div class="qty"><button onclick="q(${i},-1)">−</button> <b>${x.q}</b> <button onclick="q(${i},1)">+</button></div></div>`).join(''):'<div class="empty">메뉴를 선택해 주세요.</div>';$('total').textContent=W(t);$('pay').disabled=!cart.length}function q(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);renderCart()}function tot(){return cart.reduce((a,x)=>a+x.p*x.q,0)}function pay(){modal(`<div class="head"><h3>결제 방법을 선택하세요</h3><button class="x" onclick="closePop()">×</button></div><div class="body"><div class="methods"><button class="method" onclick="card()">카드 결제</button><button class="method" onclick="cash()">현금 결제</button></div><div class="box"><b>결제할 금액</b><br>${W(tot())}</div></div>`)}function card(){modal(`<div class="head"><h3>카드 결제</h3><button class="x" onclick="closePop()">×</button></div><div class="body"><div style="height:170px;display:grid;place-items:center"><div style="width:200px;height:120px;border-radius:18px;background:#294b68;color:white;display:grid;place-items:center;font-size:1.5rem;font-weight:900;transform:rotate(-7deg)">CARD</div></div><button class="primary" onclick="done('카드',${tot()})">카드 결제 완료</button></div>`)}function cash(){money=0;modal(`<div class="head"><h3>현금 결제</h3><button class="x" onclick="closePop()">×</button></div><div class="body"><b>돈을 눌러 금액을 맞춰보세요.</b><div class="cash">${[100,500,1000,5000,10000,50000].map(v=>`<button onclick="money+=${v};moneyView()">${W(v)}</button>`).join('')}</div><div class="box">상품 금액: <b>${W(tot())}</b><br>낸 금액: <b id="paid">0원</b><br>거스름돈: <b id="chg">0원</b></div><button class="primary" onclick="cashDone()">결제하기</button></div>`)}function moneyView(){$('paid').textContent=W(money);$('chg').textContent=W(Math.max(0,money-tot()))}function cashDone(){if(money<tot())return alert('금액이 부족해요.');done('현금',money)}function newMission(){let all=Object.values(D[S].c).flat(),x=all[Math.floor(Math.random()*all.length)],pay=Math.random()<.5?'카드':'현금';mission={n:x[0],pay};$('mission').innerHTML=`<b>오늘의 주문 미션</b><br>${x[0]} 1개를 주문하고 ${pay}로 결제하세요. <button class="pill" onclick="newMission()">새 미션</button>`}function done(method,paid){let ok=M!=='mission'||(mission&&method===mission.pay&&cart.length===1&&cart[0].n===mission.n&&cart[0].q===1),no=Math.floor(1000+Math.random()*9000);modal(`<div class="head"><h3>주문 완료</h3><button class="x" onclick="reset()">×</button></div><div class="body">${M==='mission'?`<div style="text-align:center;font-weight:1000;color:${ok?'#287f45':'#c33'};margin-bottom:10px">${ok?'미션 성공!':'미션을 다시 확인해 보세요.'}</div>`:''}<div class="receipt"><h2>${D[S].n}</h2><hr>${cart.map(x=>`<div class="rl"><span>${x.n} × ${x.q}</span><span>${W(x.p*x.q)}</span></div>`).join('')}<hr><div class="rl"><b>합계</b><b>${W(tot())}</b></div><div class="rl"><span>결제</span><span>${method}</span></div>${method==='현금'?`<div class="rl"><span>거스름돈</span><span>${W(paid-tot())}</span></div>`:''}<hr><div class="ord">${no}</div></div><button class="primary" onclick="reset()">처음으로</button></div>`)}function reset(){closePop();cart=[];renderCart();if(M==='mission')newMission()}function modal(h){$('pop').innerHTML=`<div class="ov"><div class="modal">${h}</div></div>`}function closePop(){$('pop').innerHTML=''}
</script></body></html>
